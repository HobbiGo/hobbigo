<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071a35">
<title>HOBBIGO ONE — Travel & Rentals</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#061426; --panel:#0b1d35; --panel2:#102846; --line:#203a5d;
  --blue:#168cff; --blue2:#49b3ff; --cyan:#27d9ff;
  --text:#f3f8ff; --muted:#91a8c4; --green:#27d17f; --orange:#ffb84d; --red:#ff5d6c;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}
html{scroll-behavior:smooth}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
button,input,select{font:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:245px;min-width:245px;background:#081a30;border-right:1px solid var(--line);padding:22px 15px;position:fixed;left:0;top:0;bottom:0;z-index:50;overflow-y:auto;}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 24px;}
.logoMark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:900;color:white;box-shadow:0 8px 25px rgba(22,140,255,.35);}
.logoText strong{display:block;font-size:17px;letter-spacing:1px;}
.logoText span{color:var(--muted);font-size:10px;letter-spacing:1.5px;}
.navTitle{color:#526b88;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:15px 12px 8px;}
.nav button{width:100%;border:0;background:transparent;color:#a9bad0;padding:12px 13px;border-radius:11px;display:flex;align-items:center;gap:11px;text-align:left;margin-bottom:4px;transition:.2s;}
.nav button:hover{background:#102945;color:#fff;}
.nav button.active{background:linear-gradient(90deg,rgba(22,140,255,.23),rgba(22,140,255,.05));color:#fff;border:1px solid rgba(22,140,255,.3);}
.navIcon{width:25px;text-align:center;font-size:16px;}
.badge{margin-left:auto;min-width:20px;padding:2px 6px;border-radius:20px;background:var(--blue);color:#fff;font-size:10px;text-align:center;}
.sideBottom{margin-top:25px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(16,40,70,.55);}
.sideBottom small{color:var(--muted);display:block;margin-bottom:6px;}
.customerId{color:#fff;font-size:13px;font-weight:800;}

/* MAIN */
.main{margin-left:245px;width:calc(100% - 245px);min-height:100vh;}
.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:40;background:rgba(6,20,38,.93);backdrop-filter:blur(16px);}
.topSearch{flex:1;max-width:650px;position:relative;}
.topSearch input{width:100%;background:#0c2039;border:1px solid var(--line);border-radius:12px;padding:11px 42px 11px 15px;color:#fff;outline:none;}
.topSearch input:focus{border-color:var(--blue);}
.searchIcon{position:absolute;right:14px;top:10px;}
.topActions{margin-left:auto;display:flex;gap:8px;}
.iconBtn{border:1px solid var(--line);background:#0c2039;color:#fff;width:40px;height:40px;border-radius:11px;position:relative;}
.iconBtn:hover{border-color:var(--blue);}
.iconBadge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:9px;min-width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* PAGES */
.page{display:none;padding:28px;max-width:1500px;margin:auto;}
.page.active{display:block}
.pageHead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;}
.pageHead h1{font-size:28px;margin-bottom:5px;}
.pageHead p{color:var(--muted);}
.kicker{color:var(--blue2);font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;}

/* HERO */
.hero{min-height:365px;border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(90deg,rgba(4,16,31,.98) 0%,rgba(4,16,31,.86) 43%,rgba(4,16,31,.28) 100%),url("https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1800&q=85") center/cover;display:flex;align-items:center;padding:45px;box-shadow:var(--shadow);}
.heroContent{max-width:650px}
.hero h1{font-size:clamp(34px,5vw,64px);line-height:.98;margin:12px 0 17px;letter-spacing:-2px;}
.hero h1 span{color:var(--blue2);}
.hero p{color:#b8c9dc;line-height:1.65;max-width:570px;}
.heroBtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;}
.btn{border:0;border-radius:11px;padding:11px 17px;color:#fff;background:#183352;border:1px solid #2a486b;transition:.2s;font-weight:700;}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#087be9,#19a6ff);border-color:#1ca2ff;}
.btn.green{background:linear-gradient(135deg,#159d62,#28cf80);border-color:#2bd486;}
.btn.danger{background:#351923;border-color:#69313c;color:#ff9ba5;}
.btn.small{padding:8px 11px;font-size:12px;}
.btn.full{width:100%}

/* SEARCH PANEL */
.travel-search-panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:25px;position:relative;z-index:10;box-shadow:var(--shadow);}
.search-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.search-tabs button{background:none;border:none;color:var(--muted);padding:10px 0;font-weight:700;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.search-tabs button.active{color:var(--blue2);border-bottom-color:var(--blue2);}
.search-content{display:none;}
.search-content.active{display:block;}
.form-row{display:flex;gap:10px;align-items:center;position:relative;flex-wrap:wrap;}
.input-box{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 15px;cursor:pointer;transition:0.2s;position:relative;}
.input-box:hover{border-color:var(--blue2);}
.input-box label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.input-inner{display:flex;align-items:center;gap:10px;}
.input-inner strong{display:block;color:#fff;font-size:14px;}
.input-inner small{color:var(--muted);font-size:10px;display:block;margin-top:2px;}
.input-date{width:100%;background:transparent;border:none;color:#fff;font-size:14px;font-weight:700;outline:none;color-scheme:dark;}
.swap-btn{background:var(--panel2);border:1px solid var(--line);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;position:absolute;left:22%;z-index:2;transform:translateX(-50%);box-shadow:0 4px 10px rgba(0,0,0,0.3);}
.swap-btn:hover{background:var(--blue);border-color:var(--blue);}
.btn-search{background:var(--blue);border:none;color:#fff;padding:0 25px;height:56px;border-radius:12px;font-size:18px;cursor:pointer;transition:0.2s;display:flex;align-items:center;justify-content:center;min-width:80px;}
.btn-search:hover{background:var(--blue2);}

/* Dropdown */
.dropdown-menu{position:absolute;top:110%;left:0;width:420px;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);z-index:100;overflow:hidden;max-height:350px;overflow-y:auto;}
.dropdown-menu.hidden{display:none;}
.dropdown-header{padding:12px 15px;font-size:11px;color:var(--muted);font-weight:800;display:flex;justify-content:space-between;background:#091a2d;border-bottom:1px solid var(--line);}
.dropdown-item{padding:12px 15px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;border-bottom:1px solid var(--line);transition:0.2s;}
.dropdown-item:hover{background:var(--panel2);}
.dropdown-item strong{display:block;color:#fff;font-size:13px;}
.dropdown-item small{color:var(--muted);font-size:11px;display:block;margin-top:3px;}
.dropdown-item .price{margin-left:auto;color:var(--orange);font-weight:800;font-size:13px;}

/* PRODUCT GRID */
.filterBar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.filter{border:1px solid var(--line);background:#0c2038;color:#91a8c4;padding:8px 12px;border-radius:30px;font-size:12px;cursor:pointer;}
.filter.active,.filter:hover{background:#12365b;border-color:#2678bc;color:#fff;}
.productGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.productCard{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s;}
.productCard:hover{transform:translateY(-2px);border-color:#28577f;}
.productImage{height:155px;background-size:cover;background-position:center;position:relative;}
.productTag{position:absolute;top:11px;left:11px;padding:5px 8px;border-radius:6px;background:rgba(3,16,30,.85);border:1px solid rgba(255,255,255,.12);font-size:10px;font-weight:800;}
.productBody{padding:16px;}
.productBody h3{font-size:16px;margin-bottom:7px;}
.productBody p{color:var(--muted);font-size:12px;line-height:1.5;min-height:36px;}
.rating{color:var(--orange);font-size:12px;margin:9px 0;}
.price{font-size:18px;font-weight:900;}
.price small{font-size:10px;color:var(--muted);font-weight:500;}
.cardActions{display:flex;gap:7px;margin-top:13px;}
.cardActions .btn{flex:1;}

/* DETAIL OPTIONS (Untuk memilih kelas/tiket) */
.option-list { display: grid; gap: 10px; }
.option-card {
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 15px;
  display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
}
.option-card:hover { border-color: var(--blue2); background: var(--panel2); }
.option-info h4 { font-size: 14px; margin-bottom: 4px; color: #fff; }
.option-info p { font-size: 11px; color: var(--muted); }
.option-price { text-align: right; }
.option-price strong { display: block; font-size: 16px; color: var(--blue2); margin-bottom: 5px; }

/* SECTION */
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px;}
.sectionTitle h2{font-size:19px;}
.sectionTitle span{color:var(--muted);font-size:12px;}

/* SERVICE */
.serviceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}
.serviceCard{min-height:180px;padding:22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,#102b4a,#091a2e);cursor:pointer;transition:.2s;position:relative;overflow:hidden;}
.serviceCard:hover{transform:translateY(-3px);border-color:#2c79bd;}
.serviceIcon{width:45px;height:45px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;background:rgba(22,140,255,.15);border:1px solid rgba(22,140,255,.25);margin-bottom:16px;}
.serviceCard h3{margin-bottom:7px;}
.serviceCard p{color:var(--muted);line-height:1.5;font-size:13px;}
.serviceArrow{position:absolute;right:20px;top:22px;color:var(--blue2);}

/* INFO CARDS */
.infoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}
.infoCard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;}
.infoCard h3{margin:10px 0 7px;}
.infoCard p{color:var(--muted);font-size:12px;line-height:1.55;}
.infoIcon{font-size:27px;}

/* CART */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px;}
.cartLayout{display:grid;grid-template-columns:1.5fr .8fr;gap:18px;}
.cartItem{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);}
.cartItem:last-child{border-bottom:0}
.cartThumb{width:72px;height:60px;border-radius:10px;object-fit:cover;}
.cartInfo{flex:1}
.cartInfo strong{display:block;margin-bottom:4px}
.cartInfo span{color:var(--muted);font-size:11px;}
.qty{display:flex;align-items:center;gap:7px;}
.qty button{width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:#0a1a2d;color:#fff;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.emptyIcon{font-size:42px;margin-bottom:12px;}
.summaryRow{display:flex;justify-content:space-between;padding:10px 0;color:#aabbd0;font-size:13px;}
.summaryRow.total{border-top:1px solid var(--line);margin-top:7px;padding-top:16px;color:#fff;font-size:18px;font-weight:900;}

/* ORDERS */
.orderList{display:grid;gap:12px;}
.orderCard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;}
.orderTop{display:flex;justify-content:space-between;gap:10px;align-items:center;}
.orderId{font-weight:900;font-size:14px;}
.status{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;}
.status.pending{background:#392c13;color:#ffc765;}
.status.paid{background:#103928;color:#5fe3a2;}
.status.completed{background:#10354a;color:#5ecaff;}
.status.cancelled{background:#3a1720;color:#ff8d99;}
.orderBody{display:flex;justify-content:space-between;gap:15px;margin-top:13px;color:var(--muted);font-size:12px;}
.orderProducts{margin-top:12px;color:#d9e5f3;line-height:1.6;}
.orderActions{display:flex;gap:7px;margin-top:14px;}

/* PAYMENT */
.paymentGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.payMethods{display:grid;gap:8px;}
.payMethod{border:1px solid var(--line);background:#091a2d;padding:14px;border-radius:11px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.payMethod.active{border-color:var(--blue);background:#0d2946;}
.payMethod strong{font-size:13px}
.payMethod span{display:block;color:var(--muted);font-size:10px;margin-top:3px;}
.qr{width:190px;height:190px;margin:18px auto;padding:12px;background:#fff;border-radius:10px;display:grid;grid-template-columns:repeat(13,1fr);gap:2px;}
.qr i{display:block;background:#071426;}
.qr i:nth-child(3n){background:#fff}
.paymentState{text-align:center;padding:10px;border-radius:9px;background:#0a1d31;color:#91a8c4;}

/* PROFILE */
.profileGrid{display:grid;grid-template-columns:.75fr 1.25fr;gap:18px;}
.profileHero{background:linear-gradient(145deg,#102f51,#081a2e);border:1px solid var(--line);border-radius:18px;padding:25px;text-align:center;}
.avatar{width:85px;height:85px;margin:auto;border-radius:50%;background:linear-gradient(135deg,#118aff,#29d9ff);display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900;}
.profileHero h2{margin:14px 0 4px}
.profileHero p{color:var(--muted);font-size:12px;}
.profileStats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:20px;}
.profileStat{background:#07182b;padding:13px;border-radius:10px;}
.profileStat strong{display:block;font-size:20px;}
.profileStat span{color:var(--muted);font-size:10px;}
.detailList{display:grid;gap:10px;}
.detailRow{display:flex;justify-content:space-between;padding:13px;background:#091a2d;border-radius:10px;}
.detailRow span{color:var(--muted)}
.detailRow strong{font-size:13px}

/* MODAL */
.modalWrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px;}
.modalWrap.show{display:flex}
.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#0b1d35;border:1px solid #29486a;border-radius:20px;box-shadow:0 25px 90px rgba(0,0,0,.5);}
.modalHead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
.modalHead h2{font-size:18px}
.close{width:33px;height:33px;border-radius:9px;border:1px solid var(--line);background:#0a1a2d;color:#fff;}
.modalBody{padding:20px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field{margin-bottom:12px;}
.field.full{grid-column:1/-1}
.field label{display:block;color:#9db1c9;font-size:11px;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#07182b;color:#fff;border-radius:9px;padding:11px;outline:none;}
.field textarea{min-height:90px;resize:vertical}
.modalFooter{display:flex;justify-content:flex-end;gap:8px;padding:15px 20px;border-top:1px solid var(--line);}

/* TOAST */
.toast{position:fixed;right:22px;bottom:22px;z-index:200;background:#102b49;border:1px solid #2c5b83;color:#fff;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);transform:translateY(100px);opa
