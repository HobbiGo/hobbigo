<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HobbiGo - Marketplace</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:linear-gradient(135deg,#111827,#26354d);
color:white;
padding:24px 18px;
text-align:center;
}

.logo{
font-size:32px;
font-weight:bold;
}

.tagline{
font-size:14px;
margin-top:6px;
opacity:.85;
}

.container{
max-width:800px;
margin:auto;
padding:20px 15px;
}

.card{
background:white;
padding:20px;
border-radius:18px;
margin-bottom:18px;
box-shadow:0 5px 20px rgba(0,0,0,.07);
}

input,select{
width:100%;
padding:13px;
border:1px solid #d5dbe5;
border-radius:10px;
font-size:16px;
margin-top:7px;
}

label{
display:block;
font-weight:bold;
margin-top:12px;
}

button{
width:100%;
padding:14px;
margin-top:18px;
border:0;
border-radius:10px;
background:#ff6b35;
color:white;
font-size:16px;
font-weight:bold;
}

.result{
display:none;
}

.market-title{
margin-top:0;
}

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.product{
background:#f8fafc;
border-radius:14px;
padding:15px;
border:2px solid transparent;
}

.product:hover{
border-color:#ff6b35;
}

.product h3{
margin:5px 0;
font-size:17px;
}

.product p{
font-size:13px;
color:#667085;
}

.price{
font-size:18px;
font-weight:bold;
color:#ff6b35;
}

.product button{
margin-top:10px;
padding:10px;
font-size:14px;
}

.selected{
border-color:#ff6b35;
background:#fff7f2;
}

.total{
font-size:28px;
font-weight:bold;
color:#ff6b35;
}

.small{
font-size:13px;
color:#667085;
}
</style>
</head>

<body>

<header>

<div class="logo">✈️ HobbiGo</div>

<div class="tagline">
AI Journey & Experience Marketplace
</div>

</header>

<div class="container">

<div class="card">

<h2>🌍 AI Trip Planner</h2>

<label>Tujuan</label>
<input id="tujuan" placeholder="Contoh: Bali">

<label>Tanggal</label>
<input id="tanggal" type="date">

<label>Jumlah Orang</label>
<input id="orang" type="number" value="2" min="1">

<label>Durasi</label>

<select id="durasi">
<option value="2">2 Hari</option>
<option value="3" selected>3 Hari</option>
<option value="4">4 Hari</option>
<option value="5">5 Hari</option>
<option value="7">7
