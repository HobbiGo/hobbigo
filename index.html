<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HobbiGo - Smart Route</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#111827,#26354d);
  color:white;
  padding:25px 18px;
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.tagline{
  font-size:14px;
  margin-top:6px;
  opacity:.85;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px 15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

input,select{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:1px solid #d5dbe5;
  border-radius:10px;
  font-size:16px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:11px;
  background:#ff6b35;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.route{
  border:2px solid #e5e7eb;
  border-radius:15px;
  padding:16px;
  margin-top:12px;
  cursor:pointer;
}

.route:hover{
  border-color:#ff6b35;
}

.route.selected{
  border-color:#ff6b35;
  background:#fff7f3;
}

.product{
  border:1px solid #e1e5eb;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
}

.product button{
  margin-top:10px;
  background:#172033;
}

.product.selected{
  border:2px solid #ff6b35;
  background:#fff8f5;
}

.price{
  font-size:18px;
  font-weight:bold;
  color:#ff6b35;
}

.totalBox{
  position:sticky;
  bottom:10px;
  background:#172033;
  color:white;
  padding:18px;
  border-radius:16px;
  margin-top:20px;
}

.total{
  font-size:28px;
  font-weight:bold;
  color:#ffb08d;
}

.hidden{
  display:none;
}

.success{
  text-align:center;
  padding:25px;
  background:#ecfdf3;
  border-radius:15px;
}
</style>
</head>


<body>

<header>

<div class="logo">
✈️ HobbiGo
</div>

<div class="tagline">
AI Journey & Experience Marketplace
</div>

</header>


<div class="container">


<!-- TRIP -->

<div class="card">

<h2>🌍 Trip Planner</h2>

<label>Tujuan</label>

<input
id="tujuan"
placeholder="Contoh: Bali"
>


<label>Tanggal</label>

<input
id="tanggal"
type="date"
>


<label>Jumlah Orang</label>

<input
id="orang"
type="number"
value="2"
min
