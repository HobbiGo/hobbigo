<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HobbiGo - Travel Search Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="logo" onclick="showPage('home')">
    <i class="fa-solid fa-earth-americas" style="color:var(--gold)"></i> Hobbi<span>Go</span>
  </div>
  <div class="nav-icons">
    <button class="btn-icon"><i class="fa-solid fa-globe"></i> ID / IDR</button>
    <button class="btn-icon"><i class="fa-regular fa-user"></i> Sign In</button>
  </div>
</header>

<main>
  <!-- HALAMAN 1: PENCARIAN -->
  <section id="home" class="page active">
    <div class="search-hero">
      <!-- TABS -->
      <div class="search-tabs">
        <button class="tab active" onclick="setTab(this, 'hotel')"><i class="fa-solid fa-bed"></i> Stays</button>
        <button class="tab" onclick="setTab(this, 'flight')"><i class="fa-solid fa-plane"></i> Flights</button>
        <button class="tab" onclick="setTab(this, 'car')"><i class="fa-solid fa-car"></i> Cars</button>
      </div>

      <!-- FORM HOTEL -->
      <div id="form-hotel" class="search-form">
        <div class="input-group" style="flex: 2;">
          <label>Where to?</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" id="searchDestHotel" value="Jakarta">
          </div>
        </div>
        <div class="input-group">
          <label>Dates</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-calendar"></i>
            <input type="text" value="Oct 30 - Nov 1" readonly>
          </div>
        </div>
        <div class="input-group">
          <label>Travelers</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user"></i>
            <input type="text" value="2 travellers, 1 room" readonly>
          </div>
        </div>
        <button class="btn-search" onclick="executeSearch('hotel')"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <!-- FORM FLIGHT -->
      <div id="form-flight" class="search-form" style="display:none;">
        <div class="input-group">
          <label>Leaving from</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-plane-departure"></i>
            <input type="text" value="Jakarta (CGK)">
          </div>
        </div>
        <div class="input-group">
          <label>Going to</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-plane-arrival"></i>
            <input type="text" id="searchDestFlight" value="Bali (DPS)">
          </div>
        </div>
        <div class="input-group">
          <label>Dates</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-calendar"></i>
            <input type="text" value="Nov 4 - Nov 11" readonly>
          </div>
        </div>
        <button class="btn-search" onclick="executeSearch('flight')"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </div>
  </section>

  <!-- HALAMAN 2: HASIL PENCARIAN -->
  <section id="results" class="page">
    <div class="mini-search-bar">
      <div class="mini-input"><i class="fa-solid fa-location-dot"></i> <span id="resDest">Jakarta</span></div>
      <div class="mini-input"><i class="fa-regular fa-calendar"></i> Oct 30 - Nov 1</div>
      <button class="btn-gold" onclick="showPage('home')">Edit Pencarian</button>
    </div>

    <div class="results-layout">
      <div class="sidebar">
        <div class="filter-box">
          <h4>Filter by</h4>
          <div class="filter-group">
            <label>Price</label>
            <div class="price-inputs">
              <input type="text" placeholder="Min">
              <input type="text" placeholder="Max">
            </div>
          </div>
        </div>
      </div>

      <div class="main-results">
        <div class="results-header">
          <h2 id="resultsTitle">Menampilkan Hasil...</h2>
          <select class="sort-select">
            <option>Recommended</option>
            <option>Price (low to high)</option>
          </select>
        </div>
        
        <!-- Container Hasil -->
        <div class="hotel-list" id="resultsList"></div>
      </div>
    </div>
  </section>

  <!-- HALAMAN 3: DETAIL -->
  <section id="detail" class="page">
    <button class="btn-back" onclick="showPage('results')"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
    <div class="detail-gallery">
      <img src="https://images.pexels.com/photos/261102/pexels-photo-261102.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Main" class="main-img" id="detailImg">
      <div class="sub-imgs">
        <img src="https://images.pexels.com/photos/271624/pexels-photo-271624.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Room">
        <img src="https://images.pexels.com/photos/189296/pexels-photo-189296.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Pool">
      </div>
    </div>

    <div class="detail-header">
      <div>
        <span class="luxury-badge">Premium</span>
        <h1 id="detailTitle">Nama Item</h1>
        <div class="rating-badge" style="margin-top:10px; display:inline-block;">9.4 <span>Exceptional</span></div>
      </div>
      <div class="detail-price-box">
        <h2 id="detailPrice">Rp 0</h2>
        <small>per item</small>
        <button class="btn-gold full-width" onclick="alert('Berhasil ditambahkan ke keranjang!')">Book Now</button>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
