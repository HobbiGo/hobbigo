<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOBBIGO ONE — Global Travel Marketplace & AI Operating System</title>
<style>
  :root {
    --bg-dark: #04101e;
    --panel-bg: #0b1d35;
    --panel-hover: #102948;
    --border-color: #1a3a60;
    --blue: #168cff;
    --cyan: #27d9ff;
    --orange: #ff9f1a;
    --text: #f3f8ff;
    --muted: #91a8c4;
    --green: #27d17f;
    --red: #ff5d6c;
    --shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; cursor: pointer; }

  /* TOP HEADER NAVBAR */
  header {
    background: rgba(4, 16, 30, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 30px; height: 70px;
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand-logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 20px; color: white;
    box-shadow: 0 0 15px rgba(22, 140, 255, 0.4);
  }
  .brand-text strong { display: block; font-size: 16px; letter-spacing: 1px; }
  .brand-text span { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; }

  .nav-menu { display: flex; gap: 10px; list-style: none; overflow-x: auto; padding: 5px; }
  .nav-menu::-webkit-scrollbar { height: 4px; }
  .nav-menu::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
  .nav-menu a { color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .nav-menu a:hover, .nav-menu a.active { color: #fff; background: rgba(22, 140, 255, 0.15); border: 1px solid rgba(22, 140, 255, 0.3); }

  .top-actions { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    background: var(--panel-bg); border: 1px solid var(--border-color);
    color: white; width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .badge {
    position: absolute; top: -5px; right: -5px; background: var(--red);
    color: white; font-size: 9px; min-width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }

  /* MAIN CONTAINER & PAGES */
  main { flex: 1; max-width: 1300px; width: 100%; margin: 0 auto; padding: 30px 20px; }
  .page { display: none; }
  .page.active { display: block; }

  /* TOOLBAR SELECTOR 20 LAYAR */
  .tools-quickbar {
    background: var(--panel-bg); border: 1px solid var(--border-color);
    padding: 12px 20px; border-radius: 12px; margin-bottom: 25px;
    display: flex; gap: 10px; overflow-x: auto; align-items: center;
  }
  .tools-quickbar span { font-size: 11px; font-weight: 800; color: var(--cyan); white-space: nowrap; text-transform: uppercase; }
  .tool-chip {
    background: var(--bg-dark); border: 1px solid var(--border-color);
    color: var(--muted); padding: 5px 12px; border-radius: 20px; font-size: 11px;
    cursor: pointer; white-space: nowrap; transition: 0.2s;
  }
  .tool-chip:hover, .tool-chip.active { background: var(--blue); color: white; border-color: var(--blue); }

  /* COMPONENTS & CARDS */
  .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .btn {
    border: 0; border-radius: 10px; padding: 10px 18px; color: white;
    background: #183352; border: 1px solid #2a486b; font-weight: 600; font-size: 13px;
    transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--blue); }
  .btn.primary { background: linear-gradient(135deg, #087be9, #19a6ff); border-color: #1ca2ff; }
  .btn.green { background: linear-gradient(135deg, #159d62, #28cf80); border-color: #2bd486; }
  .btn.full { width: 100%; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color);
    color: white; padding: 11px; border-radius: 9px; outline: none;
  }

  /* TOAST */
  .toast { position: fixed; bottom: 25px; right: 25px; background: var(--panel-bg); border: 1px solid var(--blue); color: white; padding: 12px 20px; border-radius: 10px; box-shadow: var(--shadow); transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 300; font-size: 13px; }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } .nav-menu { display: none; } }
</style>
</head>
<body>

  <!-- TOP HEADER NAVBAR -->
  <header>
    <div class="brand" onclick="goToTool(4)">
      <div class="brand-logo">H</div>
      <div class="brand-text">
        <strong>HOBBIGO</strong>
        <span>ONE ECOSYSTEM</span>
      </div>
    </div>

    <ul class="nav-menu">
      <li><a onclick="goToTool(4)">Home</a></li>
      <li><a onclick="goToTool(7)">Destinasi</a></li>
      <li><a onclick="goToTool(10)">Checkout</a></li>
      <li><a onclick="goToTool(13)">My Trip</a></li>
      <li><a onclick="goToTool(18)">Profile</a></li>
      <li><a onclick="goToTool(20)">Admin</a></li>
    </ul>

    <div class="top-actions">
      <button class="icon-btn" onclick="goToTool(10)" title="Keranjang">🛒<span class="badge" id="cartBadge">0</span></button>
      <button class="icon-btn" onclick="goToTool(17)" title="Notifikasi">🔔</button>
    </div>
  </header>

  <main>
    <!-- QUICKBAR 20 LAYAR TOOLS -->
    <div class="tools-quickbar">
      <span>20 Layer Tools:</span>
      <div id="toolChipsContainer" style="display:flex; gap:8px;"></div>
    </div>

    <!-- CONTAINER UTAMA SEMUA LAYAR -->
    <div id="dynamicScreenContainer"></div>
  </main>

  <div class="toast" id="toastBox">Notifikasi</div>

  <script>
    /* DATABASE 20 LAYAR / TOOL SESUAI URUTAN WIREFRAME */
    const toolsData = [
      { id: 1, name: "1. Splash Screen", cat: "Auth" },
      { id: 2, name: "2. Onboarding", cat: "Auth" },
      { id: 3, name: "3. Login / Register", cat: "Auth" },
      { id: 4, name: "4. Home", cat: "Core" },
      { id: 5, name: "5. AI Trip Planner", cat: "AI Engine" },
      { id: 6, name: "6. Hasil AI Trip Planner", cat: "AI Engine" },
      { id: 7, name: "7. Destinasi & Hotel", cat: "Marketplace" },
      { id: 8, name: "8. Detail Produk", cat: "Marketplace" },
      { id: 9, name: "9. Smart Route & Transport", cat: "Logistics" },
      { id: 10, name: "10. Keranjang & Checkout", cat: "Transaction" },
      { id: 11, name: "11. Pembayaran", cat: "Transaction" },
      { id: 12, name: "12. Booking Confirmation", cat: "Transaction" },
      { id: 13, name: "13. My Trip", cat: "User" },
      { id: 14, name: "14. Partner Marketplace", cat: "Partner" },
      { id: 15, name: "15. Create Your Own Event", cat: "Service" },
      { id: 16, name: "16. AI Travel Video", cat: "AI Engine" },
      { id: 17, name: "17. Notifikasi & Inbox", cat: "User" },
      { id: 18, name: "18. Profile", cat: "User" },
      { id: 19, name: "19. Partner Dashboard", cat: "Dashboard" },
      { id: 20, name: "20. Admin Dashboard", cat: "Dashboard" }
    ];

    let cart = JSON.parse(localStorage.getItem('hbg_cart') || '[]');
    let currentTool = 4; // Default ke Home

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.add('show');
      setTimeout(() => box.classList.remove('show'), 2500);
    }

    function initQuickbar() {
      const container = document.getElementById('toolChipsContainer');
      container.innerHTML = toolsData.map(t => `
        <div class="tool-chip ${t.id === currentTool ? 'active' : ''}" onclick="goToTool(${t.id})">
          ${t.name}
        </div>
      `).join('');
    }

    function goToTool(id) {
      currentTool = id;
      initQuickbar();
      renderScreen(id);
    }

    function renderScreen(id) {
      const container = document.getElementById('dynamicScreenContainer');
      let html = "";

      switch(id) {
        case 1: // Splash Screen
          html = `
            <div class="panel" style="text-align:center; padding:60px 20px; background:linear-gradient(135deg, #07162c, #04101e);">
              <div class="brand-logo" style="width:80px; height:80px; font-size:40px; margin:0 auto 20px;">H</div>
              <h1 style="font-size:32px; margin-bottom:10px;">HOBBIGO</h1>
              <p style="color:var(--muted); margin-bottom:30px;">Your World, One Journey</p>
              <button class="btn primary" onclick="goToTool(2)">Mulai Eksplorasi (Next)</button>
            </div>
          `;
          break;

        case 2: // Onboarding
          html = `
            <div class="panel" style="text-align:center; padding:40px;">
              <h2>Jelajahi Dunia Dengan Hobbigo</h2>
              <p style="color:var(--muted); margin:15px 0 30px;">Semua kebutuhan perjalananmu dalam satu aplikasi pintar terintegrasi.</p>
              <button class="btn primary" onclick="goToTool(3)">Lanjutkan ke Login</button>
            </div>
          `;
          break;

        case 3: // Login / Register
          html = `
            <div class="panel" style="max-width:450px; margin:0 auto;">
              <h2>Welcome Back!</h2>
              <p style="color:var(--muted); font-size:12px; margin-bottom:20px;">Login untuk melanjutkan perjalanan.</p>
              <div class="form-group"><label>Email / No. HP</label><input type="text" placeholder="user@hobbigo.com"></div>
              <div class="form-group"><label>Password</label><input type="password" placeholder="••••••••"></div>
              <button class="btn primary full" onclick="goToTool(4); showToast('Login Berhasil!')">Login Sekarang</button>
            </div>
          `;
          break;

        case 4: // Home
          html = `
            <div class="panel" style="background:linear-gradient(135deg, #0b1d35, #04101e); padding:40px;">
              <span style="color:var(--cyan); font-size:11px; font-weight:800;">HOBBIGO ONE PLATFORM</span>
              <h1 style="font-size:36px; margin:10px 0 15px;">Discover Bali & Beyond</h1>
              <p style="color:var(--muted); margin-bottom:20px;">Pesan hotel, tiket pesawat, eSIM TELKU, hingga layanan jastip CHELEA.</p>
              <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn primary" onclick="goToTool(5)">✦ AI Trip Planner</button>
                <button class="btn" onclick="goToTool(7)">Cari Destinasi</button>
                <button class="btn green" onclick="goToTool(14)">Partner Marketplace</button>
              </div>
            </div>
          `;
          break;

        case 5: // AI Trip Planner
          html = `
            <div class="panel" style="max-width:600px; margin:0 auto;">
              <h2>✦ AI Trip Planner</h2>
              <p style="color:var(--muted); font-size:12px; margin-bottom:20px;">Masukkan preferensi liburanmu, biarkan AI merancangkan rute terbaik.</p>
              <div class="form-group"><label>Tujuan</label><input type="text" value="Bali, Indonesia"></div>
              <div class="form-group"><label>Tanggal</label><input type="text" value="12 - 16 Jun 2026"></div>
              <div class="form-group"><label>Budget (IDR)</label><input type="text" value="Rp 15.000.000"></div>
              <button class="btn primary full" onclick="goToTool(6)">Buat Rencana dengan AI</button>
            </div>
          `;
          break;

        case 6: // Hasil AI Trip Planner
          html = `
            <div class="panel">
              <h2>Rencana Perjalanan AI Anda</h2>
              <p style="color:var(--green); font-weight:700; margin:10px 0;">Skor Optimal Rute: 98% (Sangat Efisien)</p>
              <div class="grid-3" style="margin-top:20px;">
                <div class="panel" style="background:var(--bg-dark)"><h4>Hari 1</h4><p style="color:var(--muted); font-size:12px;">Check-in & Sunset Dinner Jimbaran</p></div>
                <div class="panel" style="background:var(--bg-dark)"><h4>Hari 2</h4><p style="color:var(--muted); font-size:12px;">Snorkeling & Nusa Penida Tour</p></div>
                <div class="panel" style="background:var(--bg-dark)"><h4>Hari 3</h4><p style="color:var(--muted); font-size:12px;">Ubud Cultural Walk & Departure</p></div>
              </div>
              <button class="btn primary" style="margin-top:20px;" onclick="goToTool(10)">Checkout Paket Ini</button>
            </div>
          `;
          break;

        case 7: // Destinasi & Hotel
          html = `
            <div class="panel">
              <h2>Destinasi & Hotel Pilihan</h2>
              <div class="grid-3" style="margin-top:20px;">
                <div class="panel" style="background:var(--bg-dark)">
                  <h3>The Apurva Kempinski Bali</h3>
                  <p style="color:var(--cyan); font-weight:800; margin:10px 0;">Rp 2.450.000 / malam</p>
                  <button class="btn primary full" onclick="goToTool(8)">Lihat Detail</button>
                </div>
                <div class="panel" style="background:var(--bg-dark)">
                  <h3>Bali Mandira Beach Resort</h3>
                  <p style="color:var(--cyan); font-weight:800; margin:10px 0;">Rp 1.850.000 / malam</p>
                  <button class="btn primary full" onclick="goToTool(8)">Lihat Detail</button>
                </div>
              </div>
            </div>
          `;
          break;

        case 8: // Detail Produk
          html = `
            <div class="panel grid-2">
              <div>
                <h2>The Apurva Kempinski Bali</h2>
                <p style="color:var(--muted); margin:15px 0;">Resor mewah bintang 5 di Nusa Dua dengan fasilitas privat pool, spa kelas dunia, dan pemandangan laut langsung.</p>
                <h3 style="color:var(--cyan); margin-bottom:20px;">Rp 2.450.000 / malam</h3>
                <button class="btn primary" onclick="addToCartMock('The Apurva Kempinski', 2450000)">Pilih Kamar & Pesan</button>
              </div>
              <div style="background:var(--bg-dark); border-radius:12px; padding:20px;">
                <h4>Fasilitas Unggulan</h4>
                <ul style="color:var(--muted); font-size:13px; margin-top:10px; padding-left:20px;">
                  <li>Wi-Fi Kecepatan Tinggi (TELKU eSIM Support)</li>
                  <li>Antar-jemput Bandara (CHELEA Logistics Support)</li>
                  <li>Private Beach Access</li>
                </ul>
              </div>
            </div>
          `;
          break;

        case 9: // Smart Route & Transport
          html = `
            <div class="panel">
              <h2>Smart Route & Transportasi</h2>
              <p style="color:var(--muted); margin-bottom:20px;">Pilih armada penjemputan cerdas yang terintegrasi dengan jadwal penerbangan Anda.</p>
              <div class="grid-3">
                <div class="panel" style="background:var(--bg-dark)"><h4>Mobil Pribadi + Driver</h4><p style="color:var(--cyan)">Rp 350.000</p><button class="btn primary full" style="margin-top:10px;" onclick="goToTool(10)">Pilih</button></div>
                <div class="panel" style="background:var(--bg-dark)"><h4>Rental Motor Lepas Kunci</h4><p style="color:var(--cyan)">Rp 75.000</p><button class="btn primary full" style="margin-top:10px;" onclick="goToTool(10)">Pilih</button></div>
              </div>
            </div>
          `;
          break;

        case 10: // Keranjang & Checkout
          let totalCart = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
          if(totalCart === 0) totalCart = 4300000; // Default demo
          html = `
            <div class="panel grid-2">
              <div>
                <h2>Keranjang & Checkout</h2>
                <div style="margin-top:15px;">
                  <div class="panel" style="background:var(--bg-dark)">
                    <strong>The Apurva Kempinski Bali (x1)</strong>
                    <p style="color:var(--muted)">Rp 2.450.000</p>
                  </div>
                  <div class="panel" style="background:var(--bg-dark)">
                    <strong>TELKU eSIM Asia 5GB (x1)</strong>
                    <p style="color:var(--muted)">Rp 99.000</p>
                  </div>
                </div>
              </div>
              <div class="panel" style="background:var(--bg-dark)">
                <h3>Ringkasan Pembayaran</h3>
                <div style="display:flex; justify-content:space-between; margin:15px 0; color:var(--muted);"><span>Subtotal</span><strong>Rp ${totalCart.toLocaleString()}</strong></div>
                <div style="display:flex; justify-content:space-between; margin:15px 0; color:var(--muted);"><span>Pajak & Layanan</span><strong>Rp 150.000</strong></div>
                <hr style="border-color:var(--border-color); margin:15px 0;">
                <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:800; color:var(--cyan); margin-bottom:20px;"><span>Total</span><strong>Rp ${(totalCart + 150000).toLocaleString()}</strong></div>
                <button class="btn primary full" onclick="goToTool(11)">Lanjut ke Pembayaran</button>
              </div>
            </div>
          `;
          break;

        case 11: // Pembayaran
          html = `
            <div class="panel" style="max-width:600px; margin:0 auto;">
              <h2>Metode Pembayaran</h2>
              <p style="color:var(--muted); font-size:12px; margin-bottom:20px;">Pilih metode pembayaran aman (Didukung Escrow & Payment Gateway).</p>
              <div class="form-group"><label><input type="radio" name="pay" checked> QRIS (Instant Scan)</label></div>
              <div class="form-group"><label><input type="radio" name="pay"> Virtual Account (BCA / Mandiri / BNI)</label></div>
              <div class="form-group"><label><input type="radio" name="pay"> Kartu Kredit / Debit</label></div>
              <button class="btn green full" style="margin-top:20px;" onclick="goToTool(12); showToast('Pembayaran Berhasil!')">Bayar Sekarang</button>
            </div>
          `;
          break;

        case 12: // Booking Confirmation
          html = `
            <div class="panel" style="text-align:center; max-width:500px; margin:0 auto;">
              <div style="font-size:50px; color:var(--green); margin-bottom:10px;">✓</div>
              <h2>Pembayaran Berhasil!</h2>
              <p style="color:var(--muted); margin:10px 0 20px;">Booking Anda telah dikonfirmasi oleh sistem HOBBIGO ONE.</p>
              <div class="panel" style="background:var(--bg-dark); text-align:left;">
                <strong>Kode Booking: HG/123456789</strong>
                <p style="color:var(--muted); font-size:12px; margin-top:5px;">E-Ticket dan eSIM QR telah dikirimkan ke email Anda.</p>
              </div>
              <button class="btn primary full" style="margin-top:20px;" onclick="goToTool(13)">Lihat My Trip Saya</button>
            </div>
          `;
          break;

        case 13: // My Trip
          html = `
            <div class="panel">
              <h2>My Trip & Aktivitas Aktif</h2>
              <div class="panel" style="background:var(--bg-dark); margin-top:15px;">
                <div style="display:flex; justify-content:space-between;">
                  <strong>Bali - 5 Hari 4 Malam</strong>
                  <span style="color:var(--green)">Aktif</span>
                </div>
                <p style="color:var(--muted); font-size:12px; margin-top:5px;">12 - 16 Jun 2026 • Hotel, Transport & TELKU eSIM</p>
                <button class="btn primary" style="margin-top:15px;" onclick="goToTool(16)">Buat AI Travel Video Kenangan</button>
              </div>
            </div>
          `;
          break;

        case 14: // Partner Marketplace
          html = `
            <div class="panel">
              <h2>Partner Marketplace (B2B / Vendor)</h2>
              <p style="color:var(--muted); font-size:12px; margin-bottom:20px;">Temukan vendor hotel, tour guide, rental kendaraan, dan kargo CHELEA terpercaya.</p>
              <div class="grid-3">
                <div class="panel" style="background:var(--bg-dark)"><h3>Hotel Partner</h3><p style="color:var(--muted); font-size:12px;">450+ Hotel Terdaftar</p></div>
                <div class="panel" style="background:var(--bg-dark)"><h3>Transport Partner</h3><p style="color:var(--muted); font-size:12px;">120+ Armada Rental</p></div>
                <div class="panel" style="background:var(--bg-dark)"><h3>CHELEA Logistics</h3><p style="color:var(--muted); font-size:12px;">Mitra Kurir & Jastip Global</p></div>
              </div>
              <button class="btn primary" style="margin-top:20px;" onclick="goToTool(15)">Daftar / Buat Event Baru</button>
            </div>
          `;
          break;

        case 15: // Create Your Own Event
          html = `
            <div class="panel" style="max-width:600px; margin:0 auto;">
              <h2>Buat Event / Meeting Anda</h2>
              <p style="color:var(--muted); font-size:12px; margin-bottom:20px;">Atur agenda corporate retreat atau event pribadi lewat HOBBIGO.</p>
              <div class="form-group"><label>Jenis Event</label><select><option>Corporate Retreat</option><option>Private Gathering</option></select></div>
              <div class="form-group"><label>Lokasi</label><input type="text" value="Bali"></div>
              <div class="form-group"><label>Jumlah Peserta</label><input type="number" value="25"></div>
              <button class="btn primary full" onclick="goToTool(14); showToast('Event Berhasil Dibuat!')">Publish Event</button>
            </div>
          `;
          break;

        case 16: // AI Travel Video
          html = `
            <div class="panel" style="text-align:center; max-width:600px; margin:0 auto;">
              <h2>AI Travel Video Anda</h2>
              <p style="color:var(--muted); font-size:12px; margin-bottom:15px;">Video sinematik perjalanan Anda otomatis digenerate oleh AI.</p>
              <div style="background:var(--bg-dark); height:220px; border-radius:12px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border-color); margin-bottom:20px;">
                <span style="font-size:40px;">▶ [ Preview Video Bali 4K ]</span>
              </div>
              <button class="btn primary" onclick="showToast('Video berhasil di-download!')">Download Video</button>
