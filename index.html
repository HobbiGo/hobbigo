<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HobbiGo - AI Journey & Experience Marketplace</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

header {
  background: #111827;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

.logo {
  font-size: 30px;
  font-weight: bold;
}

.tagline {
  margin-top: 6px;
  font-size: 14px;
  opacity: 0.85;
}

.container {
  max-width: 700px;
  margin: 25px auto;
  padding: 0 16px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #d5dbe5;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #ff6b35;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:active {
  transform: scale(0.98);
}

#tripResult {
  display: none;
  margin-top: 22px;
  padding: 20px;
  background: #eef7ff;
  border-radius: 14px;
}

.result-item {
  background: white;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
}

.price {
  font-size: 22px;
  font-weight: bold;
  color: #ff6b35;
}
</style>
</head>

<body>

<header>
  <div class="logo">✈️ HobbiGo
