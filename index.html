<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>HOBBIGO ONE — AI Journey & Experience Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --bg2:#0b1728;
  --card:#101e31;
  --card2:#14243a;
  --line:rgba(255,255,255,.09);
  --text:#f6f8fb;
  --muted:#94a5ba;
  --green:#27d3a2;
  --green2:#19b98d;
  --blue:#4da3ff;
  --orange:#ffb454;
  --red:#ff647c;
  --shadow:0 20px 60px rgba(0,0,0,.25);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(39,211,162,.10),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(77,163,255,.10),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:90px;
}

.container{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(20px);
  background:rgba(7,17,31,.82);
  border-bottom:1px solid var(--line);
}

.header-inner{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:21px;
  letter-spacing:-.6px;
}

.logo-mark{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--green),#3de6c0);
  color:#06151a;
  box-shadow:0 8px 30px rgba(39,211,162,.22);
}

.logo small{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:1px;
  font-weight:700;
}

.desktop-nav{
  display:flex;
  gap:5px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 13px;
  border-radius:12px;
  font-size:13px;
}

.nav-btn:hover,
.nav-btn.active{
  color:white;
  background:rgba(255,255,255,.07);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:white;
}

/* MOBILE NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  z-index:2000;
  display:none;
  background:rgba(7,17,31,.94);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}

.bottom-nav-inner{
  height:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.bottom-item{
  border:0;
  background:none;
  color:var(--muted);
  font-size:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.bottom-item span:first-child{
  font-size:20px;
}

.bottom-item.active{
  color:var(--green);
}

/* PAGE */

.page{
  padding:30px 0;
  animation:fadeIn .25s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.page-title{
  font-size:32px;
  font-weight:900;
  letter-spacing:-1.2px;
  margin-bottom:8px;
}

.page-subtitle{
  color:var(--muted);
  margin-bottom:26px;
}

.section{
  margin-top:32px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin-bottom:16px;
}

.section-title{
  font-size:21px;
  font-weight:800;
}

.section-link{
  color:var(--green);
  font-size:13px;
  border:0;
  background:none;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:30px;
  min-height:430px;
  padding:48px;
  display:flex;
  align-items:center;
  background:
    linear-gradient(110deg,rgba(7,17,31,.97),rgba(7,17,31,.66)),
    radial-gradient(circle at 80% 30%,rgba(39,211,162,.32),transparent 25%),
    radial-gradient(circle at 95% 80%,rgba(77,163,255,.25),transparent 28%),
    #10253a;
  box-shadow:var(--shadow);
}

.hero-content{
  max-width:650px;
}

.badge{
  display:inline-flex;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(39,211,162,.11);
  border:1px solid rgba(39,211,162,.25);
  color:var(--green);
  font-size:11px;
  font-weight:800;
  letter-spacing:.5px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(38px,6vw,70px);
  line-height:.98;
  letter-spacing:-3px;
  margin-bottom:20px;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  color:#b9c7d7;
  font-size:16px;
  line-height:1.7;
  max-width:580px;
}

/* SEARCH */

.search-panel{
  margin-top:28px;
  padding:12px;
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr auto;
  gap:8px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.055);
}

.search-input{
  min-height:50px;
  border:1px solid transparent;
  background:rgba(0,0,0,.18);
  border-radius:13px;
  color:white;
  padding:0 14px;
  outline:none;
}

.search-input:focus{
  border-color:rgba(39,211,162,.4);
}

/* BUTTONS */

.btn{
  min-height:46px;
  padding:0 17px;
  border:0;
  border-radius:13px;
  font-weight:800;
  color:#06151a;
  background:var(--green);
}

.btn:hover{
  filter:brightness(1.08);
}

.btn.secondary{
  color:white;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
}

.btn.blue{
  color:white;
  background:var(--blue);
}

.btn.orange{
  color:#211405;
  background:var(--orange);
}

.btn.danger{
  color:white;
  background:var(--red);
}

.btn.full{
  width:100%;
}

/* GRID */

.grid{
  display:grid;
  gap:14px;
}

.grid-2{
  grid-template-columns:repeat(2,1fr);
}

.grid-3{
  grid-template-columns:repeat(3,1fr);
}

.grid-4{
  grid-template-columns:repeat(4,1fr);
}

/* CARDS */

.card{
  background:linear-gradient(145deg,rgba(20,36,58,.92),rgba(12,27,45,.92));
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.12);
}

.card:hover{
  border-color:rgba(255,255,255,.14);
}

.service-card{
  min-height:150px;
  cursor:pointer;
  transition:.2s;
}

.service-card:hover{
  transform:translateY(-3px);
}

.service-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:23px;
  background:rgba(39,211,162,.10);
  margin-bottom:15px;
}

.service-card h3{
  font-size:16px;
  margin-bottom:5px;
}

.service-card p{
  font-size:12px;
  color:var(--muted);
}

/* PRODUCT */

.product{
  overflow:hidden;
  padding:0;
}

.product-cover{
  height:150px;
  display:grid;
  place-items:center;
  font-size:52px;
  background:
    radial-gradient(circle at 50% 30%,rgba(39,211,162,.25),transparent 40%),
    #10283d;
}

.product-body{
  padding:18px;
}

.product-title{
  font-size:17px;
  font-weight:800;
}

.product-meta{
  color:var(--muted);
  font-size:12px;
  margin:6px 0 13px;
}

.price{
  font-size:19px;
  font-weight:900;
}

.price small{
  color:var(--muted);
  font-size:11px;
  font-weight:500;
}

/* FORM */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:12px;
  color:var(--muted);
}

.form-control{
  width:100%;
  min-height:48px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0a1728;
  color:white;
  padding:0 13px;
  outline:none;
}

textarea.form-control{
  padding:13px;
  min-height:100px;
  resize:vertical;
}

/* TRIP */

.trip-builder{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.trip-result{
  min-height:100%;
}

.itinerary-item{
  display:grid;
  grid-template-columns:55px 1fr;
  gap:13px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.itinerary-item:last-child{
  border-bottom:0;
}

.time{
  color:var(--green);
  font-weight:900;
  font-size:13px;
}

.itinerary-item h4{
  margin-bottom:4px;
}

.itinerary-item p{
  color:var(--muted);
  font-size:12px;
}

/* STAT */

.stat{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

.stat-value{
  font-size:24px;
  font-weight:900;
}

/* STATUS */

.status{
  display:inline-flex;
  padding:6px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  background:rgba(39,211,162,.10);
  color:var(--green);
}

.status.pending{
  background:rgba(255,180,84,.10);
  color:var(--orange);
}

.status.failed{
  background:rgba(255,100,124,.10);
  color:var(--red);
}

/* LIST */

.list{
  display:flex;
  flex-direction:column;
}

.list-row{
  padding:16px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.list-row:last-child{
  border-bottom:0;
}

.list-main{
  min-width:0;
}

.list-title{
  font-weight:800;
  font-size:14px;
}

.list-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

/* PROFILE */

.profile-head{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:22px;
}

.avatar{
  width:66px;
  height:66px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--green),#43a9ff);
  color:#07111f;
  font-weight:900;
  font-size:24px;
}

.profile-name{
  font-size:23px;
  font-weight:900;
}

.profile-email{
  color:var(--muted);
  font-size:12px;
}

.profile-section{
  margin-top:18px;
}

.profile-section-title{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:800;
  margin:0 0 8px 8px;
}

.profile-menu{
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:rgba(255,255,255,.025);
}

.profile-menu button{
  width:100%;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  color:white;
  min-height:58px;
  padding:0 17px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
}

.profile-menu button:last-child{
  border-bottom:0;
}

.profile-menu button:hover{
  background:rgba(255,255,255,.045);
}

.menu-icon{
  width:35px;
  height:35px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.06);
}

.menu-copy{
  flex:1;
}

.menu-copy strong{
  display:block;
  font-size:13px;
}

.menu-copy span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.chevron{
  color:var(--muted);
}

/* CART */

.cart-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.cart-total{
  display:flex;
  justify-content:space-between;
  padding-top:20px;
  font-size:20px;
  font-weight:900;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0c1b2d;
  border:1px solid var(--line);
  border-radius:24px;
  padding:23px;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  font-size:21px;
}

.close{
  width:36px;
  height:36px;
  border-radius:10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:white;
}

/* TOAST */

.toast{
  position:fixed;
  right:18px;
  bottom:88px;
  z-index:7000;
  background:#11243a;
  border:1px solid var(--line);
  color:white;
  padding:13px 16px;
  border-radius:13px;
  box-shadow:var(--shadow);
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:none;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:42px;
  margin-bottom:12px;
}

/* RESPONSIVE */

@media(max-width:900px){
  .desktop-nav{
    display:none;
  }

  .bottom-nav{
    display:block;
  }

  .grid-4{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-3{
    grid-template-columns:repeat(2,1fr);
  }

  .trip-builder{
    grid-template-columns:1fr;
  }

  .search-panel{
    grid-template-columns:1fr 1fr;
  }

  .search-panel .btn{
    grid-column:1/-1;
  }
}

@media(max-width:600px){
  .container{
    width:min(100% - 22px,1180px);
  }

  .page{
    padding:22px 0;
  }

  .hero{
    min-height:510px;
    padding:27px 21px;
    border-radius:24px;
  }

  .hero h1{
    font-size:43px;
    letter-spacing:-2px;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .search-panel{
    grid-template-columns:1fr;
  }

  .search-panel .btn{
    grid-column:auto;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .header-inner{
    height:62px;
  }

  .page-title{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bottom-item" onclick="openPage('home')" id="bn-home">
      <span>⌂</span><span>Home</span>
    </button>

    <button class="bottom-item" onclick="openPage('trips')" id="bn-trips">
      <span>✈</span><span>Trips</span>
    </button>

    <button class="bottom-item" onclick="openPage('market')" id="bn-market">
      <span>◈</span><span>Explore</span>
    </button>

    <button class="bottom-item" onclick="openPage('orders')" id="bn-orders">
      <span>▣</span><span>Orders</span>
    </button>

    <button class="bottom-item" onclick="openPage('profile')" id="bn-profile">
      <span>●</span><span>Profile</span>
    </button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Details</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* =========================================================
   HOBBIGO ONE MASTER V1.0
   HOBBIGO + TELKU + CHELEA
   ========================================================= */

const SUPABASE_URL =
  "https://xozjhayxttryegynntld.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oe2mqFxqjRqkx7IxO2dk8w_3UGaVsRr";

let db = null;

try{
  if(window.supabase){
    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }
}catch(e){
  console.warn("Supabase unavailable",e);
}

/* =========================================================
   GLOBAL STATE
   ========================================================= */

const state = {
  page:"home",

  customer:{
    id:localStorage.getItem("hobbigo_customer_id") || "",
    name:localStorage.getItem("hobbigo_name") || "HobbiGo Traveler",
    email:localStorage.getItem("hobbigo_email") || "",
    phone:localStorage.getItem("hobbigo_phone") || "",
    type:localStorage.getItem("hobbigo_customer_type") || "Personal"
  },

  cart:JSON.parse(
    localStorage.getItem("hobbigo_cart") || "[]"
  ),

  trips:JSON.parse(
    localStorage.getItem("hobbigo_trips") || "[]"
  ),

  chelea:JSON.parse(
    localStorage.getItem("hobbigo_chelea") || "[]"
  ),

  settings:JSON.parse(
    localStorage.getItem("hobbigo_settings") ||
    '{"language":"English","currency":"IDR","notifications":true}'
  )
};

function saveState(){

  localStorage.setItem(
    "hobbigo_customer_id",
    state.customer.id
  );

  localStorage.setItem(
    "hobbigo_name",
    state.customer.name
  );

  localStorage.setItem(
    "hobbigo_email",
    state.customer.email
  );

  localStorage.setItem(
    "hobbigo_phone",
    state.customer.phone
  );

  localStorage.setItem(
    "hobbigo_customer_type",
    state.customer.type
  );

  localStorage.setItem(
    "hobbigo_cart",
    JSON.stringify(state.cart)
  );

  localStorage.setItem(
    "hobbigo_trips",
    JSON.stringify(state.trips)
  );

  localStorage.setItem(
    "hobbigo_chelea",
    JSON.stringify(state.chelea)
  );

  localStorage.setItem(
    "hobbigo_settings",
    JSON.stringify(state.settings)
  );
}

function money(value){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(Number(value)||0);

}

function uid(prefix="HB"){

  return prefix +
    Date.now().toString(36).toUpperCase() +
    Math.random()
      .toString(36)
      .substring(2,6)
      .toUpperCase();

}

function escapeHtml(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function toast(message){

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2500);

}

/* =========================================================
   MASTER DATA
   ========================================================= */

const marketplace = [

  {
    id:"hotel-bali",
    type:"Hotel",
    icon:"🏨",
    title:"Bali Premium Stay",
    location:"Seminyak, Bali",
    price:850000,
    unit:"night",
    description:"Premium stay for your Bali journey."
  },

  {
    id:"experience-bali",
    type:"Experience",
    icon:"🌴",
    title:"Bali Sunset Experience",
    location:"Bali",
    price:450000,
    unit:"person",

function startTrip(){

  const destination =
    document.getElementById("homeDestination")?.value
    || "Bali";

  window.tripData = {
    destination
  };

  openPage("trips");

  setTimeout(()=>{

    const input =
      document.getElementById("tripDestination");

    if(input){
      input.value = destination;
    }

  },50);

}

function generateTrip(){

  const destination =
    document.getElementById("tripDestination").value.trim()
    || "Bali";

  const date =
    document.getElementById("tripDate").value
    || new Date().toISOString().split("T")[0];

  const people =
    Number(document.getElementById("tripPeople").value)||1;

  const duration =
    Number(document.getElementById("tripDuration").value)||3;

  const style =
    document.getElementById("tripStyle").value;

  const interest =
    document.getElementById("tripInterest").value;

  const hotel =
    style==="Exclusive"
      ? 1500000
      : style==="Economy"
        ? 500000
        : 850000;

  const activities =
    interest==="Food & Culinary"
      ? 300000
      : interest==="Nature & Adventure"
        ? 450000
        : 350000;

  const transport = 350000;

  const total =
    hotel * Math.max(1,duration-1)
    + activities * people
    + transport;

  const result = document.getElementById("tripResult");

  result.innerHTML = `

    <div class="badge">
      AI JOURNEY READY
    </div>

    <h2 style="font-size:25px;margin-bottom:4px">
      ${escapeHtml(destination)}
    </h2>

    <p style="color:var(--muted);font-size:12px">
      ${escapeHtml(date)}
      · ${people} traveler(s)
      · ${duration} days
    </p>

    <div style="margin-top:18px">

      ${itinerary("09:00","Arrival & Transfer",
        "Airport / station transfer to your accommodation.")}

      ${itinerary("11:00","Hotel Check-in",
        `${style} stay selected for your journey.`)}

      ${itinerary("14:00",interest,
        "Curated experience based on your travel interest.")}

      ${itinerary("18:30","Local Culinary",
        "Discover recommended local food and atmosphere.")}

      ${itinerary("20:00","Smart Route",
        "HobbiGo optimizes your route based on distance and timing.")}

    </div>

    <div class="card"
         style="margin-top:18px;background:rgba(39,211,162,.07)">

      <div class="stat">

        <div>
          <div class="stat-label">
            Estimated Journey Cost
          </div>

          <div class="stat-value">
            ${money(total)}
          </div>
        </div>

        <button
          class="btn"
          onclick="packageTrip('${escapeHtml(destination)}','${date}',${people},${duration},${total})">
          Package Journey
        </button>

      </div>

    </div>

  `;

}

function itinerary(time,title,desc){

  return `

  <div class="itinerary-item">

    <div class="time">${time}</div>

    <div>
      <h4>${title}</h4>
      <p>${desc}</p>
    </div>

  </div>

  `;

}

function packageTrip(destination,date,people,duration,total){

  const trip = {
    id:uid("TRIP-"),
    destination,
    date,
    people,
    duration,
    total,
    status:"PLANNED",
    created_at:new Date().toISOString()
  };

  state.trips.unshift(trip);
  saveState();

  addCart({
    id:trip.id,
    type:"Trip",
    title:`${destination} Journey`,
    detail:`${duration} days · ${people} traveler(s)`,
    price:total
  });

  toast("Journey added to your package.");

  openPage("cart");

}

async function buyTelku(plan){

  const orderCode =
    "TK-" +
    Date.now().toString(36).toUpperCase();

  try{

    if(db){

      const {error} =
        await db
        .from("telku_orders")
        .insert({

          order_code:orderCode,

          plan:plan.name,

          detail:plan.detail,

          price:plan.price,

          status:"PENDING",

          payment:"PENDING"

        });

      if(error){
        console.warn("TELKU order error:",error);
      }

    }

  }catch(e){

    console.warn(e);

  }

  addCart({
    id:orderCode,
    type:"TELKU",
    title:plan.name,
    detail:plan.detail,
    price:plan.price
  });

  toast("TELKU plan added to checkout.");

  openPage("cart");

    document.getElementById("cheleaDestination").value.trim();

  const category =
    document.getElementById("cheleaCategory").value;

    Number(document.getElementById("cheleaWeight").value)||1;

    document.getElementById("cheleaNotes").value.trim();

    code:uid("CHE-"),

    origin,

    destination,

    category,

    notes,

    status:"REQUESTED",

    created_at:new Date().toISOString()

  };

  saveState();

async function confirmCheckout(){

  if(!state.cart.length){

    toast("Your cart is empty.");

    return;

  }

  state.customer.name =
    document.getElementById("checkoutName").value.trim();

  state.customer.email =
    document.getElementById("checkoutEmail").value.trim();

  saveState();

  const orderCode =
    uid("HBG-");

  const total =
    state.cart.reduce(
      (sum,x)=>sum+Number(x.price||0),
      0
    );

  const order = {

    id:orderCode,

    customer:state.customer.name,

    email:state.customer.email,

    items:[...state.cart],

    total,

    status:"PENDING PAYMENT",

    payment:document
      .getElementById("checkoutPayment").value,

    created_at:new Date().toISOString()

  };

  const orders =
    JSON.parse(
      localStorage.getItem("hobbigo_orders")||"[]"
    );

  orders.unshift(order);

  localStorage.setItem(
    "hobbigo_orders",
    JSON.stringify(orders)
  );

  state.cart=[];

  saveState();

  toast("Order created successfully.");

  openPage("orders");

}

            </div>

          </div>

          📊

        </div>

      </div>

    `).join("");

}

/* =========================================================
   TOP UP
   ========================================================= */

function renderTopup(){

  return `

  <div class="page">

    <div class="container">

      <div class="page-title">
        TELKU Top Up
      </div>

      <div class="page-subtitle">
        Add additional data to your travel connectivity.
      </div>

      <div class="grid grid-3">

        ${[
          ["1GB","Rp 25.000"],
          ["3GB","Rp 59.000"],
          ["5GB","Rp 89.000"]
        ].map(x=>`

          <div class="card">

            <div class="badge">
              TELKU
            </div>

            <h2>${x[0]}</h2>

            <div class="price" style="margin-top:15px">
              ${x[1]}
            </div>

            <button
              class="btn full"
              style="margin-top:18px"
              onclick="createTopup('${x[0]}','${x[1]}')">
              Top Up
            </button>

          </div>

        `).join("")}

      </div>

    </div>

  </div>

  `;

}

async function createTopup(data,priceText){

  const amount =
    Number(
      priceText
      .replace(/[^\d]/g,"")
    )||0;

  const code=uid("TOP-");

  try{

    if(db){

      await db
      .from("telku_topups_v2")
      .insert({

        topup_code:code,

        amount,

        status:"PENDING"

      });

    }

  }catch(e){

    console.warn(e);

  }

  toast(`${data} top up created.`);

}

/* =========================================================
   WALLET
   ========================================================= */

async function renderWallet(){

  let balance=0;

  if(db){

    try{

      const {data} =
        await db
        .from("telku_wallet_v2")
        .select("*")
        .limit(1);

      if(data && data[0]){

        balance =
          Number(
            data[0].balance ||
            data[0].amount ||
            0
          );

      }

    }catch(e){}

  }

  return `

  <div class="page">

    <div class="container">

      <div class="page-title">
        Wallet
      </div>

      <div class="page-subtitle">
        Your HobbiGo payment balance.
      </div>

      <div class="card"
           style="background:
           linear-gradient(135deg,rgba(39,211,162,.16),rgba(77,163,255,.10))">

        <div class="stat">

          <div>

            <div class="stat-label">
              Available Balance
            </div>

            <div class="stat-value"
                 style="font-size:38px">
              ${money(balance)}
            </div>

          </div>

          <div style="font-size:50px">
            💳
          </div>

        </div>

      </div>

      <div class="section">

        <div class="grid grid-2">

          <button
            class="btn"
            onclick="toast('Wallet top up flow ready.')">
            Add Balance
          </button>

          <button
            class="btn secondary"
            onclick="toast('Transaction history loaded.')">
            Transaction History
          </button>

        </div>

      </div>

    </div>

  </div>

  `;

}

/* =========================================================
   REFERRAL
   ========================================================= */

function renderReferral(){

  const code =
    localStorage.getItem("hobbigo_referral")
    || "HOBBI" +
       Math.random()
       .toString(36)
       .substring(2,7)
       .toUpperCase();

  localStorage.setItem(
    "hobbigo_referral",
    code
  );

  return `

  <div class="page">

    <div class="container">

      <div class="page-title">
        Referral
      </div>

      <div class="page-subtitle">
        Invite friends to travel with HobbiGo.
      </div>

      <div class="card"
           style="text-align:center">

        <div style="font-size:55px">
          🎁
        </div>

        <h2 style="margin-top:12px">
          Your Referral Code
        </h2>

        <div
          style="font-size:30px;font-weight:900;color:var(--green);margin:18px">
          ${code}
        </div>

        <button
          class="btn"
          onclick="copyReferral('${code}')">
          Copy Code
        </button>

      </div>

    </div>

  </div>

  `;

}

function copyReferral(code){

  navigator.clipboard?.writeText(code);

  toast("Referral code copied.");

}

/* =========================================================
   SETTINGS
   ========================================================= */

function renderSettings(){

  return `

  <div class="page">

    <div class="container">

      <div class="page-title">
        Settings
      </div>

      <div class="page-subtitle">
        Manage your HobbiGo experience.
      </div>

      <div class="card">

        <div class="form-grid">

          <div class="form-group">

            <label>Language</label>

            <select
              id="settingLanguage"
              class="form-control">

              <option ${state.settings.language==="English"?"selected":""}>
                English
              </option>

              <option ${state.settings.language==="Indonesia"?"selected":""}>
                Indonesia
              </option>

            </select>

          </div>

          <div class="form-group">

            <label>Currency</label>

            <select
              id="settingCurrency"
              class="form-control">

              <option selected>IDR</option>
              <option>USD</option>
              <option>SGD</option>

            </select>

          </div>

          <div class="form-group full">

            <label>Notifications</label>

            <select
              id="settingNotifications"
              class="form-control">

              <option value="true"
                ${state.settings.notifications?"selected":""}>
                Enabled
              </option>

              <option value="false"
                ${!state.settings.notifications?"selected":""}>
                Disabled
              </option>

            </select>

          </div>

          <div class="form-group full">

            <button
              class="btn"
              onclick="saveSettings()">
              Save Settings
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  `;

}

function saveSettings(){

  state.settings.language =
    document.getElementById("settingLanguage").value;

  state.settings.currency =
    document.getElementById("settingCurrency").value;

  state.settings.notifications =
    document.getElementById("settingNotifications").value==="true";

  saveState();

  toast("Settings saved.");

}

/* =========================================================
   MODAL
   ========================================================= */

function openModal(title,body){

  document.getElementById("modalTitle").textContent=title;

  document.getElementById("modalBody").innerHTML=body;

  document
    .getElementById("modal")
    .classList.add("show");

}

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}

/* =========================================================
   ROUTER
   ========================================================= */

function openPage(page){

  state.page=page;

  window.scrollTo({
    top:0,
    behavior:"instant"
  });

  render();

}

async function render(){

  let content="";

  switch(state.page){

    case "home":
      content=renderHome();
      break;

    case "trips":
      content=renderTrips();
      break;

    case "market":
      content=renderMarket();
      break;

    case "telku":
      content=renderTelku();
      break;

    case "chelea":
      content=renderChelea();
      break;

    case "cart":
      content=renderCart();
      break;

    case "checkout":
      content=renderCheckout();
      break;

    case "orders":
      content=renderOrders();
      break;

    case "profile":
      content=renderProfile();
      break;

    case "customer":
      content=renderCustomer();
      break;

    case "mytrips":
      content=renderMyTrips();
      break;

    case "esim":
      content=await renderEsim();
      break;

    case "usage":
      content=await renderUsage();
      break;

    case "topup":
      content=renderTopup();
      break;

    case "wallet":
      content=await renderWallet();
      break;

    case "referral":
      content=renderReferral();
      break;

    case "settings":
      content=renderSettings();
      break;

    default:
      state.page="home";
      content=renderHome();

  }

  document.getElementById("app").innerHTML =
    header()+content;

  updateBottomNav();

  if(state.page==="orders"){
    afterOrdersRender();
  }

  if(state.page==="esim"){
    afterEsimRender();
  }

  if(state.page==="usage"){
    afterUsageRender();
  }

}

function updateBottomNav(){

  document
    .querySelectorAll(".bottom-item")
    .forEach(x=>x.classList.remove("active"));

  const map = {

    home:"bn-home",

    trips:"bn-trips",

    market:"bn-market",

    orders:"bn-orders",

    profile:"bn-profile"

  };

  if(map[state.page]){

    document
      .getElementById(map[state.page])
      ?.classList.add("active");

  }

}

/* =========================================================
   INITIALIZE
   ========================================================= */

(async function init(){

  if(!state.customer.id){

    state.customer.id=uid("CUS-");

    saveState();

  }

  await loadTelkuPlans();

  render();

})();

</script>

</html>
