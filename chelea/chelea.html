<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>CHELEA V12</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#07111f;
 --bg2:#0b1728;
 --card:#101f33;
 --card2:#14263d;
 --line:#263b55;
 --text:#f5f8fc;
 --muted:#91a5bd;
 --blue:#42a5ff;
 --green:#21d18a;
 --yellow:#f4c95d;
 --orange:#ff9f43;
 --red:#ff6377;
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(180deg,#07111f,#0a1727);
 color:var(--text);
 min-height:100vh;
}

button,input,select{font:inherit}

button{cursor:pointer}

.app{
 max-width:920px;
 margin:auto;
 padding-bottom:90px;
}

.header{
 position:sticky;
 top:0;
 z-index:999;
 background:rgba(7,17,31,.96);
 backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);
 padding:14px 16px;
}

.headerRow{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.brand{
 font-size:23px;
 font-weight:900;
 letter-spacing:2px;
}

.brand small{
 display:block;
 color:var(--muted);
 font-size:9px;
 letter-spacing:1px;
 margin-top:3px;
}

.secure{
 color:var(--green);
 border:1px solid rgba(33,209,138,.3);
 background:rgba(33,209,138,.08);
 border-radius:20px;
 padding:7px 10px;
 font-size:9px;
 font-weight:900;
}

.back{
 width:100%;
 margin-top:12px;
 padding:10px;
 border-radius:10px;
 border:1px solid var(--line);
 background:#0c1a2d;
 color:#fff;
}

.section{
 padding:16px;
}

.hero{
 padding:20px;
 border-radius:20px;
 border:1px solid var(--line);
 background:
 radial-gradient(circle at 90% 0%,rgba(66,165,255,.18),transparent 35%),
 linear-gradient(145deg,#10253e,#0b1728);
 margin-bottom:14px;
}

.hero h1{
 font-size:28px;
 margin-bottom:8px;
}

.hero p{
 color:var(--muted);
 font-size:13px;
 line-height:1.5;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:17px;
 padding:16px;
 margin-bottom:14px;
}

.card h2{
 font-size:16px;
 margin-bottom:12px;
}

.card h3{
 font-size:14px;
 margin-bottom:7px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

@media(max-width:600px){
 .grid{grid-template-columns:1fr}
}

.stat{
 background:#0a192b;
 border:1px solid var(--line);
 border-radius:12px;
 padding:12px;
}

.stat span{
 display:block;
 color:var(--muted);
 font-size:9px;
 text-transform:uppercase;
}

.stat strong{
 display:block;
 margin-top:5px;
 font-size:17px;
}

.btn{
 width:100%;
 border:0;
 padding:13px;
 border-radius:11px;
 margin-top:8px;
 font-weight:900;
}

.primary{background:var(--blue);color:#03101b}
.green{background:var(--green);color:#03150e}
.yellow{background:var(--yellow);color:#1a1300}
.orange{background:var(--orange);color:#211000}
.red{background:var(--red);color:#25050b}

.dark{
 background:#0b192b;
 color:#fff;
 border:1px solid var(--line);
}

.btn:disabled{
 opacity:.35;
 cursor:not-allowed;
}

label{
 display:block;
 color:var(--muted);
 font-size:10px;
 margin-bottom:6px;
}

.formGroup{
 margin-bottom:11px;
}

input,select{
 width:100%;
 background:#081526;
 color:#fff;
 border:1px solid var(--line);
 border-radius:10px;
 padding:12px;
 outline:none;
}

.notice{
 padding:11px;
 border-radius:11px;
 background:rgba(66,165,255,.08);
 border:1px solid rgba(66,165,255,.25);
 color:#a9d6ff;
 font-size:11px;
 line-height:1.5;
 margin-bottom:12px;
}

.success{
 background:rgba(33,209,138,.08);
 border-color:rgba(33,209,138,.3);
 color:#8bf0c7;
}

.warning{
 background:rgba(244,201,93,.08);
 border-color:rgba(244,201,93,.3);
 color:#f8dd8c;
}

.idBox{
 background:#07111f;
 border:1px solid var(--line);
 border-radius:13px;
 padding:13px;
 margin-top:14px;
}

.idRow{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:5px 0;
 font-size:11px;
}

.idRow span{color:var(--muted)}

.status{
 display:inline-flex;
 align-items:center;
 gap:7px;
 padding:7px 10px;
 border-radius:20px;
 background:#0a192b;
 border:1px solid var(--line);
 font-size:10px;
 font-weight:900;
}

.dot{
 width:8px;
 height:8px;
 border-radius:50%;
 background:var(--blue);
}

.statusGreen{color:var(--green)}
.statusBlue{color:var(--blue)}
.statusOrange{color:var(--orange)}
.statusYellow{color:var(--yellow)}

.flow{
 display:flex;
 overflow-x:auto;
 gap:7px;
 padding-bottom:5px;
}

.flowItem{
 min-width:92px;
 padding:10px 7px;
 border-radius:10px;
 background:#0a192b;
 border:1px solid var(--line);
 text-align:center;
 color:var(--muted);
 font-size:9px;
 font-weight:900;
}

.flowItem.done{
 color:var(--green);
 border-color:rgba(33,209,138,.35);
}

.flowItem.active{
 color:var(--blue);
 border-color:rgba(66,165,255,.4);
}

.timeline{
 position:relative;
 padding-left:25px;
}

.timeline:before{
 content:"";
 position:absolute;
 left:8px;
 top:4px;
 bottom:4px;
 width:2px;
 background:#263b55;
}

.event{
 position:relative;
 margin-bottom:18px;
}

.eventDot{
 position:absolute;
 left:-22px;
 top:2px;
 width:13px;
 height:13px;
 border-radius:50%;
 background:#263b55;
 border:2px solid #07111f;
}

.event.done .eventDot{
 background:var(--green);
}

.event.active .eventDot{
 background:var(--blue);
 box-shadow:0 0 0 5px rgba(66,165,255,.12);
}

.eventTitle{
 font-size:12px;
 font-weight:900;
}

.eventTime{
 font-size:10px;
 color:var(--muted);
 margin-top:3px;
}

.eventNote{
 font-size:10px;
 color:#b8c8d9;
 margin-top:4px;
}

.map{
 width:100%;
 height:320px;
 border-radius:14px;
 overflow:hidden;
 border:1px solid var(--line);
}

.gpsGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}

.gpsBox{
 background:#081526;
 border:1px solid var(--line);
 border-radius:10px;
 padding:10px;
}

.gpsBox span{
 display:block;
 color:var(--muted);
 font-size:9px;
}

.gpsBox strong{
 display:block;
 margin-top:4px;
 font-size:12px;
}

.partner{
 display:flex;
 align-items:center;
 gap:12px;
 background:#0a192b;
 border:1px solid var(--line);
 padding:12px;
 border-radius:13px;
}

.avatar{
 width:44px;
 height:44px;
 border-radius:50%;
 background:linear-gradient(135deg,#42a5ff,#21d18a);
 color:#06121f;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:900;
}

.partnerInfo{
 flex:1;
}

.partnerInfo strong{
 display:block;
 font-size:13px;
}

.partnerInfo span{
 display:block;
 color:var(--muted);
 font-size:10px;
 margin-top:3px;
}

.price{
 font-size:30px;
 font-weight:900;
 margin:8px 0;
}

.price small{
 color:var(--muted);
 font-size:11px;
 font-weight:normal;
}

.receipt{
 background:#f7fafc;
 color:#102033;
 border-radius:14px;
 padding:16px;
}

.receipt h2{
 margin-bottom:12px;
}

.receiptRow{
 display:flex;
 justify-content:space-between;
 gap:12px;
 padding:8px 0;
 border-bottom:1px solid #dce3ea;
 font-size:11px;
}

.receiptTotal{
 display:flex;
 justify-content:space-between;
 font-size:17px;
 font-weight:900;
 padding-top:12px;
}

.bigCheck{
 width:76px;
 height:76px;
 margin:4px auto 15px;
 border-radius:50%;
 border:2px solid var(--green);
 color:var(--green);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:38px;
 background:rgba(33,209,138,.08);
}

.center{text-align:center}

.small{
 font-size:10px;
 color:var(--muted);
 line-height:1.5;
}

.bottomNav{
 position:fixed;
 left:50%;
 transform:translateX(-50%);
 bottom:0;
 width:min(920px,100%);
 z-index:1100;
 display:grid;
 grid-template-columns:repeat(6,1fr);
 background:rgba(7,17,31,.98);
 border-top:1px solid var(--line);
}

.navBtn{
 border:0;
 background:transparent;
 color:var(--muted);
 padding:9px 2px;
 font-size:8px;
}

.navBtn.active{color:#fff}

.navIcon{
 display:block;
 font-size:17px;
 margin-bottom:3px;
}

.hidden{display:none!important}

#toast{
 position:fixed;
 left:50%;
 bottom:82px;
 transform:translateX(-50%) translateY(15px);
 opacity:0;
 pointer-events:none;
 background:#14263d;
 border:1px solid var(--line);
 color:#fff;
 border-radius:12px;
 padding:11px 15px;
 font-size:11px;
 z-index:5000;
 transition:.25s;
}

#toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app">

<header class="header">

 <div class="headerRow">

  <div>
   <div class="brand">CHELEA</div>
   <small>SMART PERSONAL DELIVERY</small>
  </div>

  <div class="secure">
   ● SECURE DEMO
  </div>

 </div>

 <button class="back" onclick="backHobbigo()">
  ← BACK TO HOBBIGO
 </button>

</header>

<main id="content"></main>

<nav class="bottomNav">

 <button class="navBtn active" onclick="page('home',this)">
  <span class="navIcon">⌂</span>
  HOME
 </button>

 <button class="navBtn" onclick="page('request',this)">
  <span class="navIcon">＋</span>
  REQUEST
 </button>

 <button class="navBtn" onclick="page('payment',this)">
  <span class="navIcon">₿</span>
  PAYMENT
 </button>

 <button class="navBtn" onclick="page('tracking',this)">
  <span class="navIcon">⌖</span>
  TRACK
 </button>

 <button class="navBtn" onclick="page('live',this)">
  <span class="navIcon">●</span>
  LIVE
 </button>

 <button class="navBtn" onclick="page('orders',this)">
  <span class="navIcon">▣</span>
  ORDERS
 </button>

</nav>

</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
 CHELEA V12 MASTER DATA
========================================================= */

const STORAGE_KEY="CHELEA_V12_MASTER";

const initialData={
 transactionId:"CHL-2026-000128",
 trackingId:null,

 service:"Traveler Delivery",

 customer:"CHELEA Customer",

 origin:"Bekasi",
 destination:"Bandung",

 pickupLocation:
 "Mall Summarecon Bekasi, Jl. Boulevard Ahmad Yani, Bekasi",

 deliveryLocation:
 "Bandung Indah Plaza, Jl. Merdeka, Bandung",

 date:"23/10/2026",

 weight:2,

 priority:"Priority",

 partner:{
  name:"Andi Traveler",
  type:"Traveler Partner",
  rating:"4.9",
  vehicle:"Private Car"
 },

 price:0,

 paymentStatus:"PENDING",

 paymentReceipt:null,

 status:"REQUEST",

 pickupAt:null,
 pickupLocationGPS:null,

 arrivalAt:null,
 arrivalLocationGPS:null,

 handoverAt:null,
 handoverLocationGPS:null,

 completedAt:null,
 completedLocationGPS:null,

 live:false,

 events:[]
};

let tx=loadData();

let map=null;
let gpsMarker=null;
let gpsCircle=null;
let routeLine=null;
let watchId=null;

let gps={
 lat:null,
 lng:null,
 accuracy:null
};

function loadData(){

 try{

  const x=localStorage.getItem(STORAGE_KEY);

  if(x){
   return JSON.parse(x);
  }

 }catch(e){}

 return JSON.parse(JSON.stringify(initialData));
}

function saveData(){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(tx)
 );

}

function resetDemo(){

 if(!confirm("Reset CHELEA V12 demo?")) return;

 tx=JSON.parse(JSON.stringify(initialData));

 saveData();

 stopGPS();

 location.reload();

}


/* =========================================================
 UTILITIES
========================================================= */

function timeNow(){

 return new Date().toLocaleString(
  "id-ID",
  {
   dateStyle:"short",
   timeStyle:"medium"
  }
 );

}

function toast(text){

 const t=document.getElementById("toast");

 t.textContent=text;

 t.classList.add("show");

 setTimeout(()=>{
  t.classList.remove("show");
 },2500);

}

function backHobbigo(){

 location.href="../index.html";

}


/* =========================================================
 EVENT LOG
========================================================= */

function addEvent(
 key,
 title,
 note
){

 if(!tx.events){
  tx.events=[];
 }

 tx.events.push({
  key:key,
  title:title,
  note:note,
  time:timeNow()
 });

 saveData();

}


/* =========================================================
 PRICE
========================================================= */

function calculatePrice(){

 const base=25000;

 const distanceFee=tx.distance||72;

 const distanceCost=distanceFee*3000;

 const weightCost=Number(tx.weight||2)*5000;

 const pickup=10000;

 const protection=5000;

 const platform=7500;

 let multiplier=1;

 if(tx.priority==="Priority"){
  multiplier=1.25;
 }

 if(tx.priority==="Exclusive"){
  multiplier=1.5;
 }

 const subtotal=
  base+
  distanceCost+
  weightCost+
  pickup+
  protection+
  platform;

 tx.price=Math.round(
  subtotal*multiplier
 );

 saveData();

 return tx.price;
}


/* =========================================================
 FLOW
========================================================= */

const FLOW=[
 "REQUEST",
 "VERIFY",
 "MATCH",
 "APPROVED",
 "PAYMENT",
 "TRACKING",
 "PICKUP",
 "IN TRANSIT",
 "ARRIVED",
 "HANDOVER",
 "COMPLETED"
];

function flowPosition(){

 let status=tx.status;

 if(status==="REQUEST") return 0;
 if(status==="VERIFY") return 1;
 if(status==="MATCH") return 2;
 if(status==="APPROVED") return 3;
 if(status==="PAYMENT SUCCESS") return 4;
 if(status==="TRACKING ACTIVE") return 5;
 if(status==="PICKUP") return 6;
 if(status==="IN TRANSIT") return 7;
 if(status==="ARRIVED") return 8;
 if(status==="HANDOVER") return 9;
 if(status==="COMPLETED") return 10;

 return 0;
}

function flowHTML(){

 const pos=flowPosition();

 return `
 <div class="flow">
 ${FLOW.map((x,i)=>`

  <div class="flowItem
   ${i<pos?"done":""}
   ${i===pos?"active":""}">
   ${x}
  </div>

 `).join("")}
 </div>
 `;
}


/* =========================================================
 HOME
========================================================= */

function page(name,btn){

 document
  .querySelectorAll(".navBtn")
  .forEach(x=>x.classList.remove("active"));

 if(btn)btn.classList.add("active");

 if(name==="home")renderHome();
 if(name==="request")renderRequest();
 if(name==="payment")renderPayment();
 if(name==="tracking")renderTracking();
 if(name==="live")renderLive();
 if(name==="orders")renderOrders();

}

function renderHome(){

 document.getElementById("content").innerHTML=`

 <section class="section">

  <div class="hero">

   <h1>CHELEA V12</h1>

   <p>
    Smart Personal Delivery & Cross-Border Jastip.
    One transaction ID controls payment, tracking,
    pickup, live delivery, handover and completion.
   </p>

   <div class="idBox">

    <div class="idRow">
     <span>TRANSACTION ID</span>
     <strong>${tx.transactionId}</strong>
    </div>

    <div class="idRow">
     <span>TRACKING ID</span>
     <strong>
      ${tx.trackingId||"GENERATED AFTER PAYMENT"}
     </strong>
    </div>

    <div class="idRow">
     <span>PAYMENT</span>
     <strong>${tx.paymentStatus}</strong>
    </div>

    <div class="idRow">
     <span>STATUS</span>
     <strong>${tx.status}</strong>
    </div>

   </div>

  </div>

  ${flowHTML()}

  <div class="card">

   <h2>Transaction Control</h2>

   <div class="grid">

    <div class="stat">
     <span>Origin</span>
     <strong>${tx.origin}</strong>
    </div>

    <div class="stat">
     <span>Destination</span>
     <strong>${tx.destination}</strong>
    </div>

    <div class="stat">
     <span>Weight</span>
     <strong>${tx.weight} KG</strong>
    </div>

    <div class="stat">
     <span>Price</span>
     <strong>
      Rp ${calculatePrice().toLocaleString("id-ID")}
     </strong>
    </div>

   </div>

  </div>

  <div class="card">

   <h2>Current Status</h2>

   <div class="notice success">

    Transaction:
    <strong>${tx.transactionId}</strong><br>

    Payment:
    <strong>${tx.paymentStatus}</strong><br>

    Tracking:
    <strong>
     ${tx.trackingId||"NOT ACTIVE"}
    </strong><br>

    Current:
    <strong>${tx.status}</strong>

   </div>

   <button class="btn primary"
    onclick="page('request')">
    CREATE / REVIEW TRANSACTION
   </button>

   <button class="btn dark"
    onclick="page('payment')">
    PAYMENT & RECEIPT
   </button>

   <button class="btn dark"
    onclick="page('tracking')">
    CUSTOMER TRACKING
   </button>

   <button class="btn dark"
    onclick="page('live')">
    LIVE DELIVERY
   </button>

   <button class="btn red"
    onclick="resetDemo()">
    RESET DEMO
   </button>

  </div>

 </section>
 `;
}


/* =========================================================
 REQUEST
========================================================= */

function renderRequest(){

 document.getElementById("content").innerHTML=`

 <section class="section">

  <div class="hero">

   <h1>CREATE REQUEST</h1>

   <p>
    Transaction ID diterbitkan sebagai pusat
    seluruh proses CHELEA.
   </p>

  </div>

  <div class="card">

   <div class="formGroup">
    <label>ORIGIN</label>
    <input id="origin"
     value="${tx.origin}">
   </div>

   <div class="formGroup">
    <label>DESTINATION</label>
    <input id="destination"
     value="${tx.destination}">
   </div>

   <div class="formGroup">
    <label>PICKUP LOCATION</label>
    <input id="pickup"
     value="${tx.pickupLocation}">
   </div>

   <div class="formGroup">
    <label>DELIVERY LOCATION</label>
    <input id="delivery"
     value="${tx.deliveryLocation}">
   </div>

   <div class="formGroup">
    <label>WEIGHT KG</label>
    <input id="weight"
     type="number"
     value="${tx.weight}">
   </div>

   <div class="formGroup">
    <label>SERVICE</label>
    <select id="priority">

     <option ${tx.priority==="Standard"?"selected":""}>
      Standard
     </option>

     <option ${tx.priority==="Priority"?"selected":""}>
      Priority
     </option>

     <option ${tx.priority==="Exclusive"?"selected":""}>
      Exclusive
     </option>

    </select>
   </div>

   <button class="btn primary"
    onclick="createRequest()">
    CREATE TRANSACTION
   </button>

  </div>

  <div class="card">

   <h2>Transaction ID</h2>

   <div class="notice">
    ${tx.transactionId}
   </div>

   <p class="small">
    Transaction ID ini akan menjadi referensi
    payment, tracking, pickup, delivery,
    handover dan completed.
   </p>

  </div>

 </section>
 `;
}

function createRequest(){

 tx.origin=document.getElementById("origin").value;
 tx.destination=document.getElementById("destination").value;

 tx.pickupLocation=document.getElementById("pickup").value;
 tx.deliveryLocation=document.getElementById("delivery").value;

 tx.weight=Number(
  document.getElementById("weight").value
 );

 tx.priority=document.getElementById("priority").value;

 tx.status="VERIFY";

 tx.paymentStatus="PENDING";

 tx.trackingId=null;

 tx.events=[];

 addEvent(
  "REQUEST",
  "REQUEST CREATED",
  "Delivery request created."
 );

 addEvent(
  "VERIFY",
  "VERIFIED",
  "Identity, item and route verification completed."
 );

 addEvent(
  "MATCH",
  "PARTNER MATCHED",
  "Andi Traveler selected."
 );

 tx.status="APPROVED";

 addEvent(
  "APPROVED",
  "APPROVED",
  "Transaction approved for payment."
 );

 saveData();

 toast("TRANSACTION APPROVED");

 renderPayment();
}


/* =========================================================
 PAYMENT
========================================================= */

function renderPayment(){

 const price=calculatePrice();

 document.getElementById("content").innerHTML=`

 <section class="section">

  <div class="hero">

   <h1>PAYMENT</h1>

   <p>
    Payment harus SUCCESS sebelum
    Tracking ID diterbitkan.
   </p>

   <div class="idBox">

    <div class="idRow">
     <span>TRANSACTION</span>
     <strong>${tx.transactionId}</strong>
    </div>

    <div class="idRow">
     <span>PAYMENT STATUS</span>
     <strong>${tx.paymentStatus}</strong>
    </div>

   </div>

  </div>

  <div class="card">

   <h2>Order Summary</h2>

   <div class="grid">

    <div class="stat">
     <span>Route</span>
     <strong>
      ${tx.origin} → ${tx.destination}
     </strong>
    </div>

    <div class="stat">
     <span>Weight</span>
     <strong>${tx.weight} KG</strong>
    </div>

    <div class="stat">
     <span>Service</span>
     <strong>${tx.priority}</strong>
    </div>

    <div class="stat">
     <span>Partner</span>
     <strong>${tx.partner.name}</strong>
    </div>

   </div>

   <div class="price">
    Rp ${price.toLocaleString("id-ID")}
    <small>total payment</small>
   </div>

   ${
    tx.paymentStatus==="SUCCESS"
    ?`
     <div class="notice success">

/* =========================================================
 GPS
========================================================= */

function startGPS(){

 if(!navigator.geolocation){

  toast("GPS TIDAK TERSEDIA DI BROWSER");

  return;
 }

 if(tx.status==="COMPLETED"){

  toast("TRACKING SUDAH SELESAI");

  return;
 }

 const status=document.getElementById("gpsStatus");

 if(status){
  status.textContent="REQUESTING...";
 }

 watchId=navigator.geolocation.watchPosition(

  position=>{

   gps.lat=position.coords.latitude;

   gps.lng=position.coords.longitude;

   gps.accuracy=position.coords.accuracy;

   updateGPSUI();

   updateMapGPS();

  },

  error=>{

   console.log(error);

   const status=document.getElementById("gpsStatus");

   if(status){
    status.textContent="GPS ERROR";
   }

   toast(
    "GPS tidak dapat diakses. Pastikan permission lokasi aktif."
   );

  },

  {
   enableHighAccuracy:true,
   maximumAge:5000,
   timeout:15000
  }

 );

 const status=document.getElementById("gpsStatus");

 if(status){
  status.textContent="WATCHING GPS";
 }

 toast("GPS LIVE AKTIF");

}

function stopGPS(){

 if(watchId!==null){

  navigator.geolocation.clearWatch(
   watchId
  );

  watchId=null;

 }

 const status=document.getElementById("gpsStatus");

 if(status){
  status.textContent="STOPPED";
 }

}

function centerGPS(){

 if(
  map &&
  gps.lat!==null &&
  gps.lng!==null
 ){

  map.setView(
   [gps.lat,gps.lng],
   16
  );

 }else{

  toast("GPS BELUM TERSEDIA");

 }

}

function updateGPSUI(){

 const lat=document.getElementById("lat");
 const lng=document.getElementById("lng");
 const acc=document.getElementById("accuracy");

 if(lat)lat.textContent=
  gps.lat.toFixed(6);

 if(lng)lng.textContent=
  gps.lng.toFixed(6);

 if(acc)acc.textContent=
  Math.round(gps.accuracy)+" m";

}


/* =========================================================
 MAP
========================================================= */

function initializeMap(){

 const el=document.getElementById("map");

 if(!el)return;

 if(map){

  map.remove();

  map=null;

 }

 map=L.map("map").setView(
  [-6.2,106.816],
  8
 );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"© OpenStreetMap"
  }
 ).addTo(map);

 const origin=[-6.2383,106.9756];

 const destination=[-6.9175,107.6191];

 routeLine=L.polyline(
  [origin,destination],
  {
   weight:4
  }
 ).addTo(map);

 L.marker(origin)
  .addTo(map)
  .bindPopup("Pickup: Bekasi");

 L.marker(destination)
  .addTo(map)
  .bindPopup("Delivery: Bandung");

 map.fitBounds(
  routeLine.getBounds(),
  {padding:[20,20]}
 );

}

function updateMapGPS(){

 if(!map)return;

 if(
  gps.lat===null ||
  gps.lng===null
 )return;

 if(!gpsMarker){

  gpsMarker=L.marker(
   [gps.lat,gps.lng]
  )
  .addTo(map)
  .bindPopup("Traveler / Current GPS");

 }else{

  gpsMarker.setLatLng(
   [gps.lat,gps.lng]
  );

 }

 if(!gpsCircle){

  gpsCircle=L.circle(
   [gps.lat,gps.lng],
   {
    radius:gps.accuracy||20
   }
  ).addTo(map);

 }else{

  gpsCircle.setLatLng(
   [gps.lat,gps.lng]
  );

  gpsCircle.setRadius(
   gps.accuracy||20
  );

 }

}

  CHELEA Secure Transaction — DEMO
 </p>

 </body>

 </html>
 `;

 const blob=new Blob(
  [html],
  {type:"text/html"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;

 a.download=
  "CHELEA_FINAL_"+tx.transactionId+".html";

 document.body.appendChild(a);

 a.click();

 a.remove();

 URL.revokeObjectURL(url);

 toast("FINAL RECEIPT DOWNLOADED");
}
