<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:#fff;
  padding:18px;
  text-align:center;
  font-size:23px;
  font-weight:700;
}

.container{
  max-width:540px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
  margin-bottom:12px;
}

h3{
  margin-bottom:8px;
}

p{
  line-height:1.5;
}

input,
select{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #d6dce5;
  border-radius:10px;
  font-size:15px;
  background:#fff;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
}

.plan{
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:15px;
  padding:16px;
  margin:10px 0;
  cursor:pointer;
  transition:.2s;
}

.plan:hover{
  transform:translateY(-1px);
}

.plan.selected{
  border:2px solid #111827;
  background:#f3f4f6;
}

.plan-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.plan-code{
  font-size:12px;
  color:#667085;
  margin-top:5px;
}

.plan-info{
  margin-top:9px;
  color:#475467;
}

.price{
  font-size:20px;
  font-weight:700;
  margin-top:8px;
}

.hidden{
  display:none!important;
}

.status{
  padding:13px;
  border-radius:10px;
  margin-top:12px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#e0f2fe;
  color:#075985;
}

.code{
  background:#f3f4f6;
  padding:10px;
  border-radius:8px;
  margin-top:6px;
  font-family:monospace;
  word-break:break-all;
}

.small{
  font-size:13px;
  color:#667085;
}

.flag{
  font-size:25px;

TELKU
</header>

<div class="container">

<!-- ==================================================
     HOME
================================================== -->

<div id="home">

      Stay connected across countries with TELKU.
    </p>
  </div>

    <h3>Customer Information</h3>

    <input
      id="fullName"
      placeholder="Full Name"

    <input
      id="email"

      placeholder="Email"

  </div>

</div>

================================================== -->

        Credit / Debit Card
      </option>

      <option value="bank_transfer">

    <button

    <div id="paymentStatus"></div>

  </div>

</div>

     SUCCESS
================================================== -->

</div>

const STORAGE_KEY = "telku_demo_transactions_v1";
const CUSTOMER_KEY_PREFIX = "telku_demo_customer_";

let selectedPlan = null;

function randomCode(prefix) {
  const timestamp = Date.now().toString().slice(-6);
  const random = Math.floor(Math.random() * 900000) + 100000;
  return prefix + "-" + timestamp + "-" + random;
}

function isLocalStorageAvailable() {
  try {
    const key = "telku_demo_test";
    localStorage.setItem(key, "1");
    localStorage.removeItem(key);
    return true;
  } catch (error) {
    return false;
  }
}

function safeLocalStorageGet(key, fallback) {
  if (!isLocalStorageAvailable()) {
    return fallback;
  }

  try {
    const raw = localStorage.getItem(key);
    if (raw === null || raw === undefined || raw === "") {
      return fallback;
    }

    const parsed = JSON.parse(raw);
    return parsed !== null ? parsed : fallback;
  } catch (error) {
    return fallback;
  }
}

function safeLocalStorageSet(key, value) {
  if (!isLocalStorageAvailable()) {
    return false;
  }

  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (error) {
    return false;
  }
}

function getDemoTransactions() {
  const transactions = safeLocalStorageGet(STORAGE_KEY, []);
  return Array.isArray(transactions) ? transactions : [];
}

function saveDemoTransactions(transactions) {
  return safeLocalStorageSet(STORAGE_KEY, transactions);
}

function getPaymentMethodValue() {
  const paymentMethodEl = document.getElementById("paymentMethod");
  if (!paymentMethodEl || !paymentMethodEl.value) {
    return "online";
  }
  return paymentMethodEl.value;
}

function ensureSelectedPlan() {
  if (!selectedPlan || !selectedPlan.country || !selectedPlan.data_gb || !selectedPlan.price) {
    throw new Error("No valid plan selected.");
  }
}

function loadCountries() {
  const select = document.getElementById("countrySelect");
  const status = document.getElementById("countryStatus");

  if (!select || !status) {
    return;
  }

  select.innerHTML = '<option value="">Select Country</option>';

  DEMO_COUNTRIES.forEach((country) => {
    const option = document.createElement("option");
    option.value = country.name;
    option.textContent = country.name;
    select.appendChild(option);
  });

  status.innerText = DEMO_COUNTRIES.length + " countries available";
}

function loadPlans() {
  const countrySelect = document.getElementById("countrySelect");
  const container = document.getElementById("plans");

  if (!countrySelect || !container) {
    return;
  }

  const country = countrySelect.value;
  container.innerHTML = "";
  selectedPlan = null;

  if (!country) {
    return;
  }

  const plans = DEMO_PLANS[country] || [];

  if (!plans.length) {
    container.innerHTML = `
      <div class="card">
        <p>No plans available for this country.</p>
      </div>
    `;
    return;
  }

  plans.forEach((plan) => {
    const div = document.createElement("div");
    div.className = "plan";

    div.innerHTML = `
      <div class="plan-top">
        <div>
          <span class="flag">${plan.flag || "🌍"}</span>
          <strong>${plan.country}</strong>
        </div>
        <strong>${plan.data_gb} GB</strong>
      </div>

      <div class="plan-code">Plan: ${plan.code}</div>

      <div class="plan-info">Valid for ${plan.validity_days} days</div>

      <div class="price">IDR ${Number(plan.price).toLocaleString("id-ID")}</div>
    `;

    div.onclick = function () {
      document.querySelectorAll(".plan").forEach((item) => item.classList.remove("selected"));
      div.classList.add("selected");
      selectedPlan = plan;
      showPayment();
    };

    container.appendChild(div);
  });
}

function showPayment() {
  if (!selectedPlan) {
    return;
  }

  const homeEl = document.getElementById("home");
  const paymentPageEl = document.getElementById("paymentPage");
  const paymentSummaryEl = document.getElementById("paymentSummary");

  if (homeEl) {
    homeEl.classList.add("hidden");
  }

  if (paymentPageEl) {
    paymentPageEl.classList.remove("hidden");
  }

  if (paymentSummaryEl) {
    paymentSummaryEl.innerHTML = `
      <p><strong>${selectedPlan.country}</strong></p>
      <p>${selectedPlan.data_gb} GB / ${selectedPlan.validity_days} days</p>
      <p class="small">Plan Code: ${selectedPlan.code}</p>
      <div class="price">IDR ${Number(selectedPlan.price).toLocaleString("id-ID")}</div>
      <p class="small" style="margin-top:8px;">Plan ID: ${selectedPlan.id}</p>
    `;
  }
}

async function getOrCreateCustomer() {
  const fullNameEl = document.getElementById("fullName");
  const emailEl = document.getElementById("email");
  const phoneEl = document.getElementById("phone");
  const countrySelectEl = document.getElementById("countrySelect");

  const fullName = fullNameEl ? fullNameEl.value.trim() : "";
  const email = emailEl ? emailEl.value.trim() : "";
  const phone = phoneEl ? phoneEl.value.trim() : "";
  const country = countrySelectEl ? countrySelectEl.value : "";

  if (!fullName) {
    throw new Error("Full Name wajib diisi.");
  }

  if (!email) {
    throw new Error("Email wajib diisi.");
  }

  if (!country) {
    throw new Error("Country wajib dipilih.");
  }

  const customerKey = CUSTOMER_KEY_PREFIX + email.toLowerCase();
  const existingCustomer = safeLocalStorageGet(customerKey, null);

  if (existingCustomer && existingCustomer.customerId) {
    return existingCustomer;
  }

  const customer = {
    customerId: randomCode("TELKU-CUS"),
    fullName: fullName,
    email: email,
    phone: phone,
    country: country,
    createdAt: new Date().toISOString()
  };

  safeLocalStorageSet(customerKey, customer);

  return customer;
}

async function createOrder(customer) {
  ensureSelectedPlan();

  if (!customer || !customer.customerId) {
    throw new Error("Customer data is missing.");
  }

  return {
    orderId: randomCode("TELKU-ORD"),
    customerId: customer.customerId,
    selectedCountry: selectedPlan.country,
    selectedPlanCode: selectedPlan.code,
    selectedPlanId: selectedPlan.id,
    price: Number(selectedPlan.price),
    status: "CREATED",
    createdAt: new Date().toISOString()
  };
}

async function createPayment(order) {
  ensureSelectedPlan();

  if (!order || !order.orderId) {
    throw new Error("Order data is missing.");
  }

  const paymentMethod = getPaymentMethodValue();

  return {
    paymentId: randomCode("TELKU-TXN"),
    orderId: order.orderId,
    paymentMethod: paymentMethod,
    status: "PAYMENT_DEMO",
    amount: Number(selectedPlan.price),
    createdAt: new Date().toISOString()
  };
}

async function createInvoice(order) {
  if (!order || !order.orderId) {
    throw new Error("Order data is missing for invoice creation.");
  }

  return {
    invoiceId: randomCode("TELKU-INV"),
    orderId: order.orderId,
    status: "PAID_DEMO",
    amount: Number(selectedPlan ? selectedPlan.price : 0),
    createdAt: new Date().toISOString()
  };
}

async function createEsim(order) {
  if (!order || !order.orderId) {
    throw new Error("Order data is missing for eSIM creation.");
  }

  return {
    esimId: randomCode("TELKU-ESIM"),
    orderId: order.orderId,
    status: "ESIM_READY",
    createdAt: new Date().toISOString()
  };
}

async function markOrderPaid(order) {
  if (!order || !order.orderId) {
    throw new Error("Order data is missing for payment update.");
  }

  order.status = "PAID_DEMO";
  order.paidAt = new Date().toISOString();
  return order;
}

async function saveTransaction() {
  ensureSelectedPlan();

  const customer = await getOrCreateCustomer();
  const order = await createOrder(customer);
  const payment = await createPayment(order);
  const invoice = await createInvoice(order);
  const esim = await createEsim(order);
  const transactionId = randomCode("TELKU-TXN");
  const paidOrder = await markOrderPaid(order);

  const transaction = {
    customer: customer,
    selectedCountry: selectedPlan.country,
    selectedPlan: {
      id: selectedPlan.id,
      code: selectedPlan.code,
      country: selectedPlan.country,
      flag: selectedPlan.flag,
      data_gb: selectedPlan.data_gb,
      validity_days: selectedPlan.validity_days,
      price: Number(selectedPlan.price)
    },
    price: Number(selectedPlan.price),
    orderId: paidOrder.orderId,
    invoiceId: invoice.invoiceId,
    esimId: esim.esimId,
    transactionId: transactionId,
    paymentMethod: payment.paymentMethod,
    status: "ESIM_READY",
    createdAt: new Date().toISOString(),
    paymentStatus: payment.status,
    invoiceStatus: invoice.status,
    esimStatus: esim.status,
    orderStatus: paidOrder.status
  };

  const transactions = getDemoTransactions();
  transactions.push(transaction);
  const saved = saveDemoTransactions(transactions);

  if (!saved) {
    console.warn("localStorage unavailable; transaction kept in memory only.");
  }

  return transaction;
}

async function processPayment() {
  const button = document.getElementById("payButton");
  const status = document.getElementById("paymentStatus");

  if (!selectedPlan) {
    if (status) {
      status.innerHTML = `
        <div class="status error">Please select a plan first.</div>
      `;
    }
    return;
  }

  const paymentMethod = getPaymentMethodValue();

  if (button) {
    button.disabled = true;
    button.innerText = "Processing...";
  }

  if (status) {
    status.innerHTML = `
      <div class="status info">
        DEMO PAYMENT<br>
        Payment simulated successfully.
      </div>
    `;
  }

  try {
    const result = await saveTransaction();

    const paymentPageEl = document.getElementById("paymentPage");
    const successPageEl = document.getElementById("successPage");
    const successDataEl = document.getElementById("successData");

    if (paymentPageEl) {
      paymentPageEl.classList.add("hidden");
    }

    if (successPageEl) {
      successPageEl.classList.remove("hidden");
    }

    if (successDataEl) {
      successDataEl.innerHTML = `
        <p><strong>TELKU eSIM READY</strong></p>

        <p style="margin-top:12px;">Order ID</p>
        <div class="code">${result.orderId}</div>

        <p style="margin-top:12px;">Invoice ID</p>
        <div class="code">${result.invoiceId}</div>

        <p style="margin-top:12px;">eSIM ID</p>
        <div class="code">${result.esimId}</div>

        <p style="margin-top:12px;">Transaction ID</p>
        <div class="code">${result.transactionId}</div>

        <p style="margin-top:12px;">Country</p>
        <div class="code">${result.selectedCountry}</div>

        <p style="margin-top:12px;">Plan</p>
        <div class="code">${result.selectedPlan.code} / ${result.selectedPlan.data_gb} GB</div>

        <p style="margin-top:12px;">Price</p>
        <div class="code">IDR ${Number(result.price).toLocaleString("id-ID")}</div>

        <p style="margin-top:12px;">Payment Method</p>
        <div class="code">${paymentMethod}</div>

        <p style="margin-top:12px;">Status</p>
        <div class="code">${result.status}</div>

        <p class="small" style="margin-top:12px;">DEMO MODE — No real payment processed</p>
      `;
    }

  } catch (error) {
    console.error("TELKU DEMO ERROR:", error);

    if (status) {
      status.innerHTML = `
        <div class="status error">
          <strong>Transaction Error</strong>
          <br><br>
          ${error && error.message ? error.message : "An unknown transaction error occurred."}
        </div>
      `;
    }

    if (button) {
      button.disabled = false;
      button.innerText = "Pay Now";
    }
  }
}

loadCountries();
