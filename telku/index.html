<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#fff;
}
button,input,select{
  font:inherit;
}
button{
  cursor:pointer;
}
.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#07111f;
  padding-bottom:90px;
}
.header{
  padding:18px 18px 12px;
  position:sticky;
  top:0;
  z-index:20;
  background:#07111fee;
  backdrop-filter:blur(12px);
  border-bottom:1px solid #ffffff0d;
}
.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}
.logo span{
  color:#19d3ae;
}
.sub{
  color:#91a0b5;
  font-size:12px;
  margin-top:4px;
}
.page{
  padding:18px;
}
.hero{
  background:linear-gradient(135deg,#10263a,#0a1727);
  border:1px solid #ffffff12;
  border-radius:24px;
  padding:24px;
  margin-bottom:16px;
}
.hero h1{
  margin:0 0 8px;
  font-size:28px;
}
.hero p{
  color:#9cabbc;
  line-height:1.5;
}
.btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  background:#19d3ae;
  color:#03120f;
  font-weight:800;
}
.btn.secondary{
  background:#15283b;
  color:#fff;
}
.btn.danger{
  background:#6b2430;
  color:#fff;
}
.card{
  background:#0d1c2c;
  border:1px solid #ffffff10;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}
.card h3{
  margin:0 0 8px;
}
.muted{
  color:#8e9db0;
  font-size:13px;
}
.price{
  font-size:24px;
  font-weight:900;
  color:#19d3ae;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.menu{
  width:100%;
  text-align:left;
  background:#0d1c2c;
  color:#fff;
  border:1px solid #ffffff0d;
  border-radius:17px;
  padding:16px;
}
.menu .icon{
  font-size:25px;
  display:block;
  margin-bottom:10px;
}
.menu strong{
  display:block;
  margin-bottom:5px;
}
.menu small{
  color:#8393a8;
}
input,select{
  width:100%;
  padding:14px;
  border-radius:13px;
  border:1px solid #26384b;
  background:#091625;
  color:#fff;
  outline:none;
  margin:7px 0 12px;
}
label{
  color:#9aabbd;
  font-size:12px;
}
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:#091725f5;
  backdrop-filter:blur(15px);
  border-top:1px solid #ffffff10;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index:50;
}
.nav{
  background:none;
  border:0;
  color:#718198;
  padding:7px 2px;
  font-size:11px;
}
.nav .ni{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}
.nav.active{
  color:#19d3ae;
}
.back{
  border:0;
  background:#122337;
  color:#fff;
  border-radius:11px;
  padding:9px 13px;
  margin-bottom:15px;
}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#17372f;
  color:#19d3ae;
  font-size:11px;
  font-weight:bold;
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.empty{
  text-align:center;
  padding:35px 15px;
  color:#7f8fa2;
}
hr{
  border:0;
  border-top:1px solid #ffffff0c;
  margin:15px 0;
}
.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%) translateY(20px);
  background:#142a3c;
  border:1px solid #ffffff15;
  padding:12px 17px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
  max-width:90%;
  text-align:center;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:80;
}
.modal.show{
  display:flex;
}
.sheet{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0b1928;
  border-radius:25px 25px 0 0;
  padding:20px;
}
.close{
  float:right;
  background:#16293b;
  border:0;
  color:#fff;
  border-radius:10px;
  padding:7px 11px;
}
.qr{
  background:#fff;
  padding:12px;
  width:max-content;
  margin:15px auto;
}
.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">TELKU<span>.</span></div>
    <div class="sub">Global eSIM Travel Platform</div>
  </header>

  <main id="app"></main>

  <nav class="bottom">
    <button class="nav active" data-page="home">
      <span class="ni">⌂</span>Home
    </button>
    <button class="nav" data-page="plans">
      <span class="ni">▣</span>Plans
    </button>
    <button class="nav" data-page="orders">
      <span class="ni">▤</span>Orders
    </button>
    <button class="nav" data-page="profile">
      <span class="ni">●</span>Profile
    </button>
  </nav>

</div>

<div id="toast" class="toast"></div>

<div id="modal" class="modal">
  <div class="sheet">
    <button class="close" id="closeModal">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* =========================================================
   TELKU V2.0
   FULL PROFILE + CUSTOMER AREA
   ========================================================= */

/* ---------- SUPABASE ---------- */

const SUPABASE_URL =
  "https://xozjhayxttryegynntld.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oe2mqFxqjRqkx7IxO2dk8w_3UGaVsRr";

let db = null;

try{
  if(window.supabase){
    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }
}catch(e){
  console.log("Supabase init:",e);
}

/* ---------- CUSTOMER ---------- */

function getCustomer(){
  let customer = localStorage.getItem("telku_customer");

  if(!customer){
    customer = "TELKU-" +
      Date.now().toString(36).toUpperCase() +
      "-" +
      Math.random().toString(36).substring(2,7).toUpperCase();

    localStorage.setItem("telku_customer",customer);
  }

  return customer;
}

const CUSTOMER_ID = getCustomer();

let currentPage = "home";
let selectedPlan = null;

/* ---------- HELPERS ---------- */

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(value){
  return "Rp " + Number(value || 0).toLocaleString("id-ID");
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}

function showModal(html){
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("closeModal").onclick = closeModal;

document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal"){
    closeModal();
  }
});

function setActiveNav(page){
  document.querySelectorAll(".nav").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.page === page
    );
  });
}

/* ---------- ROUTER ---------- */

function openPage(page){
  currentPage = page;
  setActiveNav(page);

  if(page==="home") return renderHome();
  if(page==="plans") return renderPlans();
  if(page==="orders") return renderOrders();
  if(page==="profile") return renderProfile();

  if(page==="esim") return renderESIM();
  if(page==="usage") return renderUsage();
  if(page==="topup") return renderTopUp();
  if(page==="wallet") return renderWallet();
  if(page==="referral") return renderReferral();
  if(page==="settings") return renderSettings();
  if(page==="customer") return renderCustomer();
}

document.querySelectorAll(".nav").forEach(btn=>{
  btn.addEventListener("click",()=>{
    openPage(btn.dataset.page);
  });
});

/* ---------- HOME ---------- */

function renderHome(){
  document.getElementById("app").innerHTML = `
    <section class="page">

      <div class="hero">
        <h1>Travel connected.</h1>
        <p>
          Buy eSIM plans for your journey and manage
          your orders, data usage and account in one place.
        </p>

        <button class="btn" onclick="openPage('plans')">
          Explore eSIM Plans
        </button>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <strong>Customer ID</strong>
            <div class="muted">${esc(CUSTOMER_ID)}</div>
          </div>
          <span class="badge">ACTIVE</span>
        </div>
      </div>

      <h3>Quick Access</h3>

      <div class="grid">

        <button class="menu" onclick="openPage('orders')">
          <span class="icon">📦</span>
          <strong>My Orders</strong>
          <small>View purchases</small>
        </button>

        <button class="menu" onclick="openPage('esim')">
          <span class="icon">📱</span>
          <strong>My eSIM</strong>
          <small>eSIM details</small>
        </button>

        <button class="menu" onclick="openPage('usage')">
          <span class="icon">📊</span>
          <strong>Usage</strong>
          <small>Data consumption</small>
        </button>

        <button class="menu" onclick="openPage('topup')">
          <span class="icon">💳</span>
          <strong>Top Up</strong>
          <small>Add balance</small>
        </button>

      </div>

    </section>
  `;
}

/* ---------- PLANS ---------- */

async function renderPlans(){

  document.getElementById("app").innerHTML = `
    <section class="page">
      <h2>eSIM Plans</h2>
      <div class="muted">Choose a plan for your destination.</div>
      <br>
      <div id="plansList">
        <div class="empty">Loading plans...</div>
      </div>
    </section>
  `;

  let plans = [];

  if(db){
    try{
      const result = await db
        .from("telku_plans_v2")
        .select("*")
        .order("price",{ascending:true});

      if(!result.error && result.data){
        plans = result.data;
      }
    }catch(e){}
  }

  if(!plans.length){
    plans = [
      {
        plan_code:"ID3",
        name:"Indonesia 3GB",
        country:"Indonesia",
        data_gb:3,
        validity_days:7,
        price:59000
      },
      {
        plan_code:"ASIA5",
        name:"Asia Travel 5GB",
        country:"Asia",
        data_gb:5,
        validity_days:15,
        price:99000
      },
      {
        plan_code:"GLOBAL10",
        name:"Global Travel 10GB",
        country:"Global",
        data_gb:10,
        validity_days:30,
        price:249000
      }
    ];
  }

  document.getElementById("plansList").innerHTML =
    plans.map((p,i)=>{

      const code =
        p.plan_code ||
        p.code ||
        p.id ||
        ("PLAN-"+i);

      const name =
        p.name ||
        p.plan_name ||
        code;

      const data =
        p.data_gb ||
        p.data ||
        p.quota ||
        0;

      const days =
        p.validity_days ||
        p.validity ||
        p.days ||
        0;

      const price =
        p.price ||
        0;

      return `
        <div class="card">

          <div class="row">
            <div>
              <h3>${esc(name)}</h3>
              <div class="muted">${esc(p.country || "Travel eSIM")}</div>
            </div>

            <span class="badge">${esc(code)}</span>
          </div>

          <hr>

          <div class="row">
            <div>
              <div class="price">${money(price)}</div>
              <div class="muted">
                ${esc(data)} GB · ${esc(days)} days
              </div>
            </div>

            <button
              class="btn"
              style="width:auto;padding:12px 18px"
              onclick='buyPlan(${JSON.stringify({
                code,
                name,
                price,
                data,
                days
              })})'>
              Buy
            </button>
          </div>

        </div>
      `;
    }).join("");
}

/* ---------- BUY PLAN ---------- */

function buyPlan(plan){

  selectedPlan = plan;

  showModal(`
    <h2>Confirm Plan</h2>

    <div class="card">
      <h3>${esc(plan.name)}</h3>
      <div class="muted">
        ${esc(plan.data)} GB ·
        ${esc(plan.days)} days
      </div>
      <br>
      <div class="price">${money(plan.price)}</div>
    </div>

    <label>Customer name</label>
    <input id="buyName" placeholder="Your name">

    <label>Email</label>
    <input id="buyEmail" type="email" placeholder="your@email.com">

    <label>Phone</label>
    <input id="buyPhone" placeholder="+62">

    <button class="btn" onclick="submitOrder()">
      Confirm Order
    </button>
  `);
}

async function submitOrder(){

  const name =
    document.getElementById("buyName").value.trim();

  const email =
    document.getElementById("buyEmail").value.trim();

  const phone =
    document.getElementById("buyPhone").value.trim();

  if(!name){
    toast("Please enter your name");
    return;
  }

  const orderCode =
    "TELKU-" +
    Date.now().toString(36).toUpperCase();

  const detail = JSON.stringify({
    customer_id:CUSTOMER_ID,
    name,
    email,
    phone,
    data:selectedPlan.data,
    validity:selectedPlan.days
  });

  const order = {
    order_code:orderCode,
    plan:selectedPlan.name,
    detail,
    price:selectedPlan.price,
    status:"PENDING",
    payment:"PENDING"
  };

  if(db){

    try{

      const result =
        await db
          .from("telku_orders")
          .insert(order)
          .select()
          .single();

      if(result.error){
        console.log(result.error);
        toast("Order could not be saved");
        return;
      }

      try{
        await db
          .from("telku_payments")
          .insert({
            order_id:result.data.id,
            order_code:orderCode,
            amount:selectedPlan.price,
            method:"UNPAID",
            status:"PENDING"
          });
      }catch(e){}

    }catch(e){
      console.log(e);
      toast("Database connection error");
      return;
    }

  }

  closeModal();

  showModal(`
    <h2>Order Created</h2>

    <div class="card">
      <div class="muted">Order ID</div>
      <h3>${esc(orderCode)}</h3>

      <div class="muted">Plan</div>
      <strong>${esc(selectedPlan.name)}</strong>

      <hr>

      <div class="muted">Amount</div>
      <div class="price">${money(selectedPlan.price)}</div>

      <hr>

      <span class="badge">PAYMENT PENDING</span>
    </div>

    <button class="btn" onclick="closeModal();openPage('orders')">
      View My Orders
    </button>
  `);
}

/* ---------- ORDERS ---------- */

async function renderOrders(){

  document.getElementById("app").innerHTML = `
    <section class="page">

      <h2>My Orders</h2>

      <div class="muted">
        Customer ID: ${esc(CUSTOMER_ID)}
      </div>

      <br>

      <div id="ordersList">
        <div class="empty">Loading orders...</div>
      </div>

    </section>
  `;

  let orders = [];

  if(db){

    try{

      const result =
        await db
          .from("telku_orders")
          .select("*")
          .order("created_at",{ascending:false});

      if(!result.error){
        orders = result.data || [];
      }

    }catch(e){}
  }

  if(!orders.length){

    document.getElementById("ordersList").innerHTML = `
      <div class="card empty">
        <div style="font-size:35px">📦</div>
        <h3>No orders yet</h3>
        <div>Choose an eSIM plan to create your first order.</div>
        <br>
        <button class="btn" onclick="openPage('plans')">
          Browse Plans
        </button>
      </div>
    `;

    return;
  }

  document.getElementById("ordersList").innerHTML =
    orders.map(order=>`

      <button
        class="menu"
        style="margin-bottom:10px"
        onclick='showOrder(${JSON.stringify(order)})'>

        <div class="row">

          <div>
            <strong>${esc(order.plan || "eSIM Plan")}</strong>

            <div class="muted">
              ${esc(order.order_code || order.id)}
            </div>

            <div class="muted">
              ${order.created_at
                ? new Date(order.created_at).toLocaleString("id-ID")
                : ""}
            </div>
          </div>

          <span class="badge">
            ${esc(order.status || "PENDING")}
          </span>

        </div>

      </button>

    `).join("");
}

function showOrder(order){

  showModal(`

    <h2>Order Detail</h2>

    <div class="card">

      <div class="muted">Order ID</div>
      <h3>${esc(order.order_code || order.id)}</h3>

      <div class="muted">Plan</div>
      <strong>${esc(order.plan || "-")}</strong>

      <hr>

      <div class="muted">Amount</div>
      <div class="price">${money(order.price)}</div>

      <hr>

      <div class="muted">Order Status</div>
      <span class="badge">${esc(order.status || "-")}</span>

      <br><br>

      <div class="muted">Payment</div>
      <span class="badge">${esc(order.payment || "-")}</span>

    </div>

    <button class="btn secondary" onclick="closeModal()">
      Close
    </button>
  `);
}

  document.getElementById("app").innerHTML = `

    <section class="page">

      <div class="hero">
        <h1>My Profile</h1>

        <p>
          Manage your TELKU account, eSIM,

        </p>

        <div class="badge">

/* ---------- CUSTOMER PROFILE ---------- */

async function renderCustomer(){

  const saved =
    JSON.parse(
      localStorage.getItem("telku_profile") || "{}"
    );

  document.getElementById("app").innerHTML = `

    <section class="page">

      <button class="back" onclick="openPage('profile')">
        ← Profile
      </button>

      <h2>Customer Profile</h2>

      <div class="card">

        <div class="muted">Customer ID</div>

        <strong>${esc(CUSTOMER_ID)}</strong>

      </div>

      <label>Full Name</label>
      <input
        id="profileName"
        value="${esc(saved.name || "")}"
        placeholder="Your full name">

      <label>Email</label>
      <input
        id="profileEmail"
        type="email"
        value="${esc(saved.email || "")}"
        placeholder="Email">

      <label>Phone</label>
      <input
        id="profilePhone"
        value="${esc(saved.phone || "")}"
        placeholder="+62">

      <button class="btn" onclick="saveCustomerProfile()">
        Save Customer Profile
      </button>

    </section>
  `;
}

async function saveCustomerProfile(){

  const profile = {
    customer_id:CUSTOMER_ID,
    name:document.getElementById("profileName").value.trim(),
    email:document.getElementById("profileEmail").value.trim(),
    phone:document.getElementById("profilePhone").value.trim()
  };

  localStorage.setItem(
    "telku_profile",
    JSON.stringify(profile)
  );

  if(db){

    try{

      await db
        .from("telku_settings_v2")
        .upsert({
          customer_id:CUSTOMER_ID,
          name:profile.name,
          email:profile.email,
          phone:profile.phone
        },{
          onConflict:"customer_id"
        });

    }catch(e){
      console.log(e);
    }
  }

  toast("Customer profile saved");
}

/* ---------- eSIM ---------- */

async function renderESIM(){

  document.getElementById("app").innerHTML = `

    <section class="page">

      <button class="back" onclick="openPage('profile')">
        ← Profile
      </button>

      <h2>My eSIM</h2>

      <div class="muted">
        Your activated eSIM profiles.
      </div>

      <br>

      <div id="esimList">
        <div class="empty">Loading eSIM...</div>

      }

    }catch(e){}
  }

  if(!rows.length){

    document.getElementById("esimList").innerHTML = `
      <div class="card empty">

        <div style="font-size:40px">📱</div>

        <h3>No eSIM profile</h3>

        <div>

          the order is provisioned.
        </div>

        <button class="btn" onclick="openPage('plans')">

        </button>

    rows.map(row=>`

      <div class="card">

        <div class="row">

          <span class="badge">
            ${esc(row.status || "ACTIVE")}
          </span>
        </div>

        <hr>

        <div class="muted">
          ICCID
        </div>

        <strong>
          ${esc(row.iccid || "-")}
        </strong>

          class="btn"
          onclick='showESIM(${JSON.stringify(row)})'>

        </button>

      </div>

}

function showESIM(row){

  showModal(`

    <h2>eSIM Details</h2>

    <div class="card">

      <div class="muted">eSIM Code</div>
      <strong>${esc(row.esim_code || "-")}</strong>

      <hr>

      <div class="muted">ICCID</div>
      <strong>${esc(row.iccid || "-")}</strong>

      <hr>

      <div class="muted">Activation Code</div>
      <strong>${esc(row.activation_code || "-")}</strong>

      <hr>

      <div class="muted">Status</div>
      <span class="badge">${esc(row.status || "-")}</span>

    </div>

    <div id="qr" class="qr"></div>

    <button
      class="btn secondary"
      onclick="closeModal()">
      Close
    </button>
  `);

  setTimeout(()=>{

    const payload =
      row.qr_payload ||
      row.activation_code ||
      "";

    if(payload && window.QRCode){

      new QRCode(
        document.getElementById("qr"),
        {
          text:payload,
          width:180,
          height:180
        }
      );

    }else{

      document.getElementById("qr").innerHTML =
        `<div style="color:#111;padding:20px">
          QR payload not available
        </div>`;

    }

  },100);
}

/* ---------- TOP UP ---------- */

function renderTopUp(){

  document.getElementById("app").innerHTML = `

    <section class="page">

      <button class="back" onclick="openPage('profile')">
        ← Profile
      </button>

      <h2>Top Up</h2>

      <div class="card">
        <div class="muted">Customer ID</div>
        <strong>${esc(CUSTOMER_ID)}</strong>
      </div>

      <label>Top Up Amount</label>

      <input
        id="topupAmount"
        type="number"
        min="10000"
        step="1000"
        placeholder="Example: 50000">

      <label>Payment Method</label>

      <select id="topupMethod">
        <option value="BANK_TRANSFER">
          Bank Transfer
        </option>
        <option value="QRIS">
          QRIS
        </option>
        <option value="CARD">
          Card
        </option>
      </select>

      <button class="btn" onclick="submitTopUp()">
        Create Top Up
      </button>

      <br><br>

      <div class="card">

        <h3>How it works</h3>

        <div class="muted">
          1. Enter the amount.<br><br>
          2. Select payment method.<br><br>
          3. Submit the top up request.<br><br>
          4. Payment status can be managed
          from the payment system.
        </div>

      </div>

    </section>
  `;
}

async function submitTopUp(){

  const amount =
    Number(
      document.getElementById("topupAmount").value
    );

  const method =
    document.getElementById("topupMethod").value;

  if(!amount || amount < 10000){
    toast("Minimum top up is Rp 10,000");
    return;
  }

  const topupCode =
    "TOP-" +
    Date.now().toString(36).toUpperCase();

  let saved=false;

  if(db){

    try{

      const result =
        await db
          .from("telku_topups_v2")
          .insert({
            customer_id:CUSTOMER_ID,
            topup_code:topupCode,
            amount,
            method,
            status:"PENDING"
          });

      if(!result.error){
        saved=true;
      }

    }catch(e){
      console.log(e);
    }
  }

  const local =
    JSON.parse(
      localStorage.getItem("telku_topups") || "[]"
    );

  local.unshift({
    code:topupCode,
    amount,
    method,
    status:"PENDING",
    created_at:new Date().toISOString()
  });

  localStorage.setItem(
    "telku_topups",
    JSON.stringify(local)
  );

  showModal(`

    <h2>Top Up Created</h2>

    <div class="card">

      <div class="muted">Top Up Code</div>

      <h3>${esc(topupCode)}</h3>

      <div class="muted">Amount</div>

      <div class="price">
        ${money(amount)}
      </div>

      <hr>

      <div class="muted">Method</div>

      <strong>${esc(method)}</strong>

      <hr>

      <span class="badge">
        PAYMENT PENDING
      </span>

    </div>

    <button class="btn" onclick="closeModal()">
      Done
    </button>

  `);
}

/* ---------- SETTINGS ---------- */

function renderSettings(){

  const saved =
    JSON.parse(
      localStorage.getItem("telku_settings") || "{}"
    );

  document.getElementById("app").innerHTML = `

    <section class="page">

      <button class="back" onclick="openPage('profile')">
        ← Profile
      </button>

      <h2>Settings</h2>

      <div class="card">

        <h3>Language</h3>

        <select id="setLanguage">

          <option value="en"
            ${saved.language==="en"?"selected":""}>
            English
          </option>

          <option value="id"
            ${saved.language==="id"?"selected":""}>
            Bahasa Indonesia
          </option>

        </select>

      </div>

      <div class="card">

        <h3>Notifications</h3>

        <select id="setNotifications">

          <option value="ON"
            ${saved.notifications!=="OFF"?"selected":""}>
            ON
          </option>

          <option value="OFF"
            ${saved.notifications==="OFF"?"selected":""}>
            OFF
          </option>

        </select>

      </div>

      <div class="card">

        <h3>Currency</h3>

        <select id="setCurrency">

          <option value="IDR"
            ${saved.currency!=="USD"?"selected":""}>
            IDR — Rupiah
          </option>

          <option value="USD"
            ${saved.currency==="USD"?"selected":""}>
            USD — US Dollar
          </option>

        </select>

      </div>

      <button class="btn" onclick="saveSettings()">
        Save Settings
      </button>

      <br><br>

      <button
        class="btn secondary"
        onclick="resetLocalSettings()">
        Reset Local Settings
      </button>

    </section>
  `;
}

async function saveSettings(){

  const settings = {

    language:
      document.getElementById("setLanguage").value,

    notifications:
      document.getElementById("setNotifications").value,

    currency:
      document.getElementById("setCurrency").value
  };

  localStorage.setItem(
    "telku_settings",
    JSON.stringify(settings)
  );

  if(db){

    try{

      await db
        .from("telku_settings_v2")
        .upsert({
          customer_id:CUSTOMER_ID,
          language:settings.language,
          notifications:settings.notifications,
          currency:settings.currency
        },{
          onConflict:"customer_id"
        });

    }catch(e){
      console.log(e);
    }
  }

  toast("Settings saved");
}

function resetLocalSettings(){

  localStorage.removeItem("telku_settings");

  toast("Local settings reset");

  setTimeout(()=>{
    renderSettings();
  },400);
}
