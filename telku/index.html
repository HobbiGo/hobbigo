/* ================= COMING SOON POPUP ================= */

#comingSoonModal{
  position:fixed;
  inset:0;
  display:none;

  justify-content:center;
  background:rgba(0,0,0,.65);

  background:#0d1929;
  border:1px solid rgba(255,255,255,.1);

}

.coming-box h3{
  margin:0 0 8px;
  font-size:20px;

  font-size:13px;

.coming-close{
  width:100%;
  border:0;
  border-radius:12px;
  padding:12px;
  background:#18c7b8;
  color:#06121f;
  font-weight:800;
  cursor:pointer;
}

</style>


<!-- ================= COMING SOON MODAL ================= -->

<div id="comingSoonModal">

  <div class="coming-box">

    <div class="coming-icon">🚀</div>

    <h3 id="comingSoonTitle">
      Coming Soon
    </h3>

    <p>
      This TELKU feature is currently being prepared
      and will be available in a future version.
    </p>

    <button class="coming-close"
            onclick="closeComingSoon()">
      OK
    </button>

  </div>

</div>


<!-- ================= PROFILE JAVASCRIPT ================= -->

<script>

function comingSoon(feature){

  const modal = document.getElementById("comingSoonModal");
  const title = document.getElementById("comingSoonTitle");

  if(title){
    title.textContent = feature + " — Coming Soon";
  }

  if(modal){
    modal.style.display = "flex";
  }
}

function closeComingSoon(){

  const modal = document.getElementById("comingSoonModal");

  if(modal){
    modal.style.display = "none";
  }
}


/*
  ORDERS
  Tetap gunakan fungsi Orders yang sudah ada
  di TELKU sebelumnya.
*/

function openOrders(){

  if(typeof showPage === "function"){
    showPage("ordersPage");
    return;
  }

  if(typeof showOrders === "function"){
    showOrders();
    return;
  }

  const ordersPage = document.getElementById("ordersPage");

  if(ordersPage){
    document.querySelectorAll(".page-section").forEach(function(page){
      page.style.display = "none";
    });

    ordersPage.style.display = "block";
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }
}


/* Close popup jika klik area luar */

document.addEventListener("click",function(e){

  const modal = document.getElementById("comingSoonModal");

  if(e.target === modal){
    closeComingSoon();
  }

});

</script>
